<!DOCTYPE html>
<html lang="nus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F3B3A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nuer Bible">
<title>Nuer Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6E3DB;--card:#F2F0EA;--ink:#17211F;--mute:#5E6A67;--nile:#0F3B3A;--on-nile:#EAE6DA;--ochre:#D9A22B;--ember:#C8472B;--line:rgba(23,33,31,.14);--h1:#F3D77A;--h2:#F0A58F;--h3:#9BD3C0;--h4:#B9B3EE;--sans:'Bricolage Grotesque',system-ui,sans-serif;--serif:'Gentium Book Plus','Gentium Plus','Charis SIL',Georgia,serif;--fs:21px;--tab:64px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0A1B1A;--card:#11292770;--ink:#E7E3D6;--mute:#8FA39F;--nile:#16504D;--on-nile:#EAE6DA;--line:rgba(231,227,214,.14);--h1:#8A6E1B;--h2:#8A3A27;--h3:#1F6B57;--h4:#4A4590;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1B1A;--card:#11292770;--ink:#E7E3D6;--mute:#8FA39F;--nile:#16504D;--line:rgba(231,227,214,.14);--h1:#8A6E1B;--h2:#8A3A27;--h3:#1F6B57;--h4:#4A4590;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;scroll-behavior:smooth;padding-bottom:calc(var(--tab) + 24px)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--nile);color:var(--on-nile);display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;opacity:.65;position:relative}
nav.tabs button[aria-current=true]{opacity:1;font-weight:600}
nav.tabs button[aria-current=true]::before{content:"";position:absolute;top:0;width:34px;height:4px;border-radius:0 0 4px 4px;background:var(--ochre)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{background:var(--nile);color:var(--on-nile);padding:34px 0 30px;position:relative;overflow:hidden;border-radius:0 0 34px 34px}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(234,230,218,.045) 22px 24px);pointer-events:none}
.hero h1{font-size:clamp(46px,14vw,78px);line-height:.88;margin:0;font-weight:800;letter-spacing:-.035em}
.hero h1 span{display:block;color:var(--ochre);font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
.hero p{margin:14px 0 0;opacity:.75;font-size:15px;max-width:30ch}
.votd{margin:-22px 0 0;position:relative;z-index:1}
.votd .c{background:var(--ochre);color:#1d1606;border-radius:22px;padding:18px 20px 16px;box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.votd small{font-weight:600;font-size:13px;opacity:.75}
.votd q{display:block;font-family:var(--serif);font-size:20px;line-height:1.4;margin:6px 0 10px;quotes:none}
.votd button{font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.resume{display:flex;align-items:center;justify-content:space-between;width:100%;margin:14px 0 0;padding:14px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left}
.resume b{font-size:17px}.resume span{color:var(--mute);font-size:13px;display:block}
.resume i{font-style:normal;background:var(--ember);color:#fff;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
h2{font-size:15px;margin:28px 0 12px;font-weight:600;color:var(--mute)}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.book{aspect-ratio:1;border-radius:18px;padding:10px 11px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .15s}
.book:active{transform:scale(.97)}
.book .n{font-family:var(--serif);font-size:44px;line-height:.8;color:transparent;-webkit-text-stroke:1.2px var(--nile);opacity:.55;position:absolute;right:9px;top:7px}
:root[data-theme="dark"] .book .n{-webkit-text-stroke-color:var(--ochre)}
.book b{font-size:16px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-top:auto}
.book span{font-size:11px;color:var(--mute)}
.book.has{background:var(--nile);color:var(--on-nile)}.book.has span{color:#EAE6DAAA}.book.has .n{-webkit-text-stroke-color:var(--ochre)}.book.off{opacity:.42;cursor:default;border-style:dashed}.book.off:active{transform:none}
.top{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px}
.top .t{flex:1;font-weight:800;font-size:19px;letter-spacing:-.02em;text-align:center;padding:8px;border-radius:12px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}.ib:hover{background:var(--line)}
.chgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:18px 0}
.chgrid button{aspect-ratio:1;border-radius:16px;background:var(--card);border:1px solid var(--line);font-family:var(--serif);font-size:26px}
.chgrid button.on{background:var(--ember);color:#fff;border-color:transparent}
.chhead{padding:30px 0 6px;display:flex;align-items:flex-end;gap:14px}
.chhead .big{font-family:var(--serif);font-size:130px;line-height:.75;color:var(--ember);font-weight:700;letter-spacing:-.04em}
.chhead div{padding-bottom:6px;color:var(--mute);font-size:14px}.chhead b{display:block;color:var(--ink);font-size:24px;font-weight:800;letter-spacing:-.02em}
.text{font-family:var(--serif);font-size:var(--fs);line-height:1.62;padding-bottom:20px}
.text h3{font-family:var(--sans);font-size:15px;font-weight:800;color:var(--nile);margin:26px 0 4px;padding-left:12px;border-left:4px solid var(--ochre)}
:root[data-theme="dark"] .text h3{color:var(--ochre)}
.v{cursor:pointer;border-radius:6px;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s}
.v sup{font-family:var(--sans);font-size:.55em;font-weight:800;color:var(--ember);margin:0 4px 0 6px;vertical-align:.55em}
.v.sel{background:rgba(217,162,43,.28);box-shadow:0 2px 0 var(--ochre)}
.v.h1{background:var(--h1)}.v.h2{background:var(--h2)}.v.h3{background:var(--h3)}.v.h4{background:var(--h4)}
.v.flash{animation:fl 1.6s}@keyframes fl{0%,60%{background:var(--ochre)}}
.v .bm{color:var(--ember);font-size:.6em;margin-left:3px}
.pager{display:flex;gap:10px;padding:10px 0 30px}.pager button{flex:1;padding:16px;border-radius:16px;font-weight:600;background:var(--nile);color:var(--on-nile)}.pager button:disabled{opacity:.3}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--ink);color:var(--bg);border-radius:22px;padding:8px 10px;display:flex;align-items:center;gap:4px;box-shadow:0 18px 40px -10px rgba(0,0,0,.5);animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,30px);opacity:0}}
.bar .sw{width:28px;height:28px;border-radius:50%;margin:0 3px;border:2px solid rgba(255,255,255,.5)}
.bar .ib{width:40px;height:40px;color:var(--bg)}.bar .ib:hover{background:rgba(128,128,128,.3)}.bar hr{width:1px;height:24px;border:0;background:rgba(128,128,128,.5);margin:0 4px}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:640px;border-radius:28px 28px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));animation:up2 .25s ease-out}
@keyframes up2{from{transform:translateY(40px);opacity:0}}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--line)}.seg button{padding:7px 14px;border-radius:9px;font-size:14px}.seg button.on{background:var(--nile);color:var(--on-nile)}
input[type=range]{accent-color:var(--ember);width:160px}
.search{position:sticky;top:0;z-index:3;padding:18px 0 10px;background:var(--bg)}
.search input{width:100%;font:inherit;font-size:17px;padding:15px 18px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.hit{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.hit b{font-size:13px;color:var(--ember);font-weight:800}.hit p{margin:4px 0 0;font-family:var(--serif);font-size:18px;line-height:1.5}
mark{background:var(--ochre);color:#1d1606;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mute);padding:60px 20px;font-size:15px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;animation:up .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ORDER=["Tuk", "Ɣöth", "Liib", "Kuen", "Ŋuɔ̱t", "Jɔc", "Ruëëc", "Ruth", "1 Tham", "2 Tham", "1 Kua̱r", "2 Kua̱r", "1 Kuɛ̈n", "2 Kuɛ̈n", "Ɛdh", "Nɛm", "Ɛth", "I-Yob", "Diit", "Pɛl", "Ŋi̱i̱c", "Thɔl", "I-ca-yaa", "Yir", "Jiɛth", "Yɛdh", "Dan", "Ɣocä", "Yo-el", "A-mɔth", "Obad", "Jona", "Mikaa", "Nɛ̈m", "Ɣäb", "Dhɛp", "Ɣag", "Dhɛk", "Mɛ̈l", "Mɛ̈t", "Mak", "Luk", "Jɔ̱ɔ̱n", "Lät", "Röm", "1 Kor", "2 Kor", "Gäl", "Ɛpɛ", "Pil", "Kol", "1 Thɛ", "2 Thɛ", "1 Tim", "2 Tim", "Tay", "Pay", "Ɣib", "Jem", "1 Pit", "2 Pit", "1 Jɔ̱ɔ̱n", "2 Jɔ̱ɔ̱n", "3 Jɔ̱ɔ̱n", "Juud", "Nyuuth"];
const EMBED={"1 Pit":{"1":{"verses":{"1":"Ɛ ɣän Pi-tɔr in la jak Yecu Kritho, gɔ̱a̱rä yɛ warɛgak ɛmɛ yɛn nɛy tin la pɛ̈ɛ̈c kä Pɔn-täth, kɛnɛ Gä-lëë-cia, kɛ Ka-pa-do-cia, kɛnɛ E-cia, kɛ Bi-thi-nia.","2":"Kɛ yɛn nɛy ti ca mɛk ce̱tkɛ ca̱r Kuɔth in la Gua̱a̱r in te nhial, kä ca yɛ jakä nɛy ti gɔw kɛ Yiëë Kuɔth kɛ ɣöö ba Yecu Kritho luɔ̱th kä bakɛ lɛy kɛ riɛmdɛ. A puɔ̱th kɛnɛ mal mi di̱i̱t te kɛɛl kɛ yɛ.","3":"A liak tekɛ Kuoth in la Gua̱n Kua̱ran ni Yecu Kritho! Kɛ kɔ̱a̱c lɔaacdɛ min di̱i̱t ca kɔn nyɔk kɛ di̱eth kɛ ŋa̱th mi tëk pa̱ny kɛ jiëc Yecu Kritho li̱th.","4":"Kä ɛn täämɛ ŋa̱thnɛ puth tin tekɛ Kuoth kɛ kui̱ nɛɛnikɛ. Kɛn puth ɛ tɔ̱ ci Kuoth kɛ tɔ̱w kɛ kui̱dun nhial guäth in /cikɛ bi kɛɛth kä /cikɛ bi jiääk kä /ci gɔɔydiɛn bi jiääk thi̱n.","5":"Ca yɛ gaŋ ɛ buɔ̱m Kuɔth kɛ kui̱ ŋäthädun amäni mi ca ka̱n nyoth kɛ gua̱a̱th guutdä ɣɔaa.","6":"Ɛn nɛmɛ bɛ lo̱ckun jakä tɛth, a cäŋ ɛn täämɛ kɛ gua̱a̱th mi tɔt bi yɛn rik ti gööl rut.","7":"Kä luɔt rikni ɛ ɣöö bɛ thuɔ̱k ŋäthädun ŋa̱c, min gɔaa ni jɛn kä da̱a̱p in la däk mi ca jɛ ɣɔ̱n kɛ mac. Ŋa̱thdun bɛ yɛn nöŋ liak kɛnɛ wuɔ̱t kɛ luth mi wa Yecu Kritho nyoth.","8":"Cäŋ ni min /ken yɛn ɛ nɛn, nhɔk yɛn ɛ. Kä a cäŋ ni min /ken yɛ jɛ nɛn ɛn täämɛ, ŋäth yɛn ɛ, kä tɛth lɔcdun kɛ jɛ ɛlɔ̱ŋ kɛ tɛ̈th mi /cia dee met luäŋ kɛ lat.","9":"Kɛ kui̱ ɛmɔ jek yɛn ni ka̱n yieynikun min la luɔt ŋäthädun.","10":"Ci göök ɛ go̱r agɔaa kä cikɛ jɛ ɣɔ̱n ɛn ɣöö bikɛ duɔ̱ɔ̱r ŋa̱c kɛ kui̱ känä nɛmɛ. Kä cukɛ ruac go̱o̱kä lat kɛ kui̱ puthä min ka̱mkɛ yɛ.","11":"Kä cukɛ jɛ go̱r i̱ ba jɛ ŋa̱c ɛn ɣöö ɛ nɛy bi gua̱a̱th ben ɔ, kä bɛ ben i̱di. Ɛ jɛn gua̱a̱th in bi Yiëë Kritho in te rɛydiɛn ɛ nyuɔ̱thkɛ, min lat rik tin bi Kritho kɛ rut, kɛnɛ buay in bi ben kä jɛ.","12":"Ca jɛ nyuɔ̱th göök tɔ̱tɔ̱ ɛn ɣöö lätkɛ kɛ kui̱dun a /ci mɔ a kui̱diɛn. Cakɛ nyuɔ̱th ŋɔaani tin ca la̱r yɛ täämɛ ɛ kɛn nɛy tin la̱tkɛ yɛ thuk ti gɔw kɛ Yiëë in Gɔaa in Rɛl Rɔ, min ca ja̱k ni nhial. Kɛ kɛn ŋɔaani tin go̱o̱r ja̱a̱k nhial ɣöö bikɛ kɛ nɛn.","13":"Kɛ kui̱ ɛmɔ rialɛ ca̱run ikä kɛ kui̱ la̱t, kä a wi̱cdun te jinä. La̱thɛ ŋa̱thdun kɛɛliw kä puɔ̱th in ba nööŋ ɛ Yecu Kritho mi wëë wä jɔɔc.","14":"Ce̱tdɛ kɛ gaat ti tekɛ luth, /cuarɛ tëkdun lɛ jakä la̱tkɛ ɛ di̱t lɔaac nyuɔɔnikun ëë wal mëë ŋuɔtdɛ a kui̱c yɛn ŋɔak.","15":"Gɔaa ni jɛn ɛn ɣöö bi yɛn a nɛy ti rɛl gɔɔydun rɔ rɛy lätnikun diaal, ce̱tkɛ min Kuoth in cɔɔl yɛ rɛl gɔɔydɛ rɔ.","16":"Kä ca jɛ gɔ̱r rɛy buɔk i̱, “A gɔɔydun rɔ rɛl kɛ ɣöö rɛl gɔɔydä rɔ.”","17":"Kä mi cɔl yɛn ɛ ala Guurun, ɛn ram in luk nɛy diaal a päär kɛ pek lätnikiɛn pa̱ny, ciaŋɛ rɔ kɛ dual kɛ gua̱a̱th ɛ lapɛ rööl wi̱i̱ muɔ̱ɔ̱n ɛ.","18":"Ŋa̱cɛ jɛ ɛn ɣöö ca yɛ luɛl kä ciaaŋ nyuɔɔni mëë cia jek kä guurdɔɔŋnikun, /ca yɛ luɛl kɛ ti däk ce̱tkɛ ciɛk in bo̱r kɛ da̱a̱p.","19":"Kä duundɛ ɣöö ca yɛ luɛl kɛ riɛm Kritho mi gɔaa mi ce̱tkɛ riɛm ruath dɛ̈ɛ̈l rɔɔmä mi thil mɛ̈ɛ̈ny kiɛ gua̱r.","20":"Jɛn ca jɛ mɛk ɛ Kuoth a /ka̱n ɣɔw ni cak, kä duundɛ ɣöö ca jɛ nyoth kɛ gua̱a̱th ɛ jɔak ɛmɛ kɛ kui̱dun.","21":"Kɛ jɛ ta̱yɛ kɛ ŋa̱th kɛ Kuoth, mi ci jɛ jiɛc li̱th, kä cuɛ jɛ ka̱m buay, kɛ ɣöö bi ŋa̱thdun kɛnɛ ŋa̱thdun kɛ ti bi ben te kä Kuoth.","22":"Täämɛ kɛ kui̱ luthädun kɛ thuɔ̱k cia tieydun jakä wic wic, a cia tekɛ nhök mi thuɔ̱k kɛ dämuɔɔrikun tin Krith-cini. Inɔ nhɔakɛ rɔ̱ ɛlɔ̱ŋ kɛ lɔcdun kɛɛliw.","23":"Kä ca yɛ nyɔk kɛ da̱p, kä jɛn tëk ɛmɔ /cɛ bä kä mi bi li̱w, duundɛ ɣöö bëë kä mi /ci bi li̱w. Bëë kä ruac Kuɔth in tëk.","24":"Ci ruac Kuɔth wee i̱, “Ce̱t nɛy diaal kɛ juaac, kä ce̱t wuɔ̱t nath kɛ gaakni juaacni. Juaac la rɔlkɛ, kä la pɛn gaaknikiɛn,","25":"kä ruac Kuɔth tëë thi̱n a thil pek.” Ruac ɛmɔ ɛ jɛn thok in gɔaa min ca la̱t yɛ."},"headings":{"3":{"text":"Ŋa̱th mi tëk kɛ mi bi ben"},"13":{"text":"Cɔl rɛy teekä mi Rɛl Rɔ"}}},"2":{"verses":{"1":"Wuɔcɛ rɔ kä jiäk diaal, kä kac kɛɛliw, kɛnɛ mɛɛt kɛɛliw, kɛ tiɛɛl kɛnɛ guer.","2":"Ce̱tkɛ gaat ti ruɔri tin görkɛ ni cak ti wiɛc wiɛɛc, kä yɛn bä görɛ ni ŋi̱i̱c yieekä mi wic wic. Kɛ jɛn duɔ̱ɔ̱p ɛmɔ bia cu rɛy känä,","3":"mi cia jɛ ŋa̱c kä cia jɛ nɛn ɛn ɣöö Kuäär ni Kuoth gɔaaɛ.","4":"Bia kä Kuäär, jɛn päm teekä min ca lo̱k ɛ naath, kä duundɛ ɣöö ca jɛ mɛk ɛ Kuoth, kä jɛn tëë luɔt mi di̱i̱t.","5":"Kä yɛn pua̱nykun ce̱t yɛn kɛ päm in tëk a yɛ ta̱thkɛ ala duel yieekä, kɛ ɣöö bi yɛn a bööth palä ti gɔw ti rɛ̈lkɛ rɔ̱, kɛ ɣöö bia muc yieekä ti nhɔakɛ thöp Kuoth kɛ Yecu Kritho.","6":"Kɛ ɣöö ca jɛ gɔ̱r rɛy ruaacni Kuɔth i̱, “Nɛ̈nɛ jɛ, ɣän kuëŋä päm rɛy Dha-yɔn, min la päm gɔŋtɔtdä mi ca mɛk, mi tekɛ luɔt mi di̱i̱t, Kä ram ɔ wä jɛ ŋäth ɔ, /ca jɛ bi jakä po̱c.”","7":"Kɛ kui̱dun, yɛn nɛy tin ŋa̱th, jɛn ɛ min gɔaa mi tekɛ luɔt. Kä duundɛ ɣöö kɛ kui̱ nɛɛni tin /ca jɛ ŋäth, “Päm in ca lo̱k ɛ ta̱a̱th duëli, ɛ jɛn päm in ci ben a päm gɔŋtɔtdä duëël.”","8":"Kä, “Ɛ jɛn päm in jak naath kä kɔ̱a̱thkɛ kɔa̱a̱thikä, ɛ jɛn päm in jak naath kä tɛth.” Kɔ̱a̱thkɛ kɔa̱a̱thikä kɛ ɣöö /ka̱n ruaacni Kuɔth luɔ̱th, ce̱tkɛ min ca la̱tkɛ i̱ bi kɛn ɛ la̱t. 9 Yɛn lapɛ thok duëël mi ca mɛk, ti bööth palä, mi la do̱r mi rɛl rɔ, nɛɛ Kuɔth ti rɛlɛ, kɛ ɣöö dee yɛn lätkɛ tin buɔ̱m buɔ̱ɔ̱m lat jɛn ram min cɔl yɛ raar rɛy muɔ̱th, cɔlɛ yɛ rɛy buɔyädɛ min gɔaa. 10 Mëëdan /ci yɛn a do̱r, kä duundɛ ɣöö ɛn täämɛ kɛ yɛn nɛɛ Kuɔth. Kä mëëdan /ka̱nɛ kɔ̱a̱c lɔaacdɛ jek, kä duundɛ ɣöö ɛn täämɛ ci yɛn kɔ̱a̱c lɔaac jek.","11":"Nhöökä, ɣän la̱ŋä yɛn tin ce̱tkɛ rööl kɛnɛ ja̱a̱l ti ci jiɛɛn ro̱o̱liɛn ɛn ɣöö /ci lo̱ckun bi di̱t kɛ nyin jiäkni pua̱a̱ny tin tɛ̈rkɛ ko̱r kɛ tieydun.","12":"Ciëŋɛ agɔaa rɛy Juri, kɛ ɣöö mi dee kɛ yɛ lat jɔ̱ɔ̱r i̱ lapɛ ji̱ nyuɔɔni, bikɛ lätkun tin gɔw nɛn kä bikɛ Kuoth liak kɛ cäŋ in bɛ ɣɔw ben gui̱l.","13":"Kɛ kui̱ Kua̱r ni Yecu nhɔakɛ ruaacni nɛɛni diaal tin ruackɛ yɛ nhɔakɛ ruec kua̱r in di̱t ni jɛn kä ti diaal,","14":"kiɛ ruëëc tin cɛ ja̱k kɛ ɣöö ba ji̱ dueeri ben duäc, kä ba nɛy ti la̱tkɛ cuŋ ben liak.","15":"Kɛ ɣöö go̱o̱r Kuoth jɛ ɛn ɣöö ba ruac dɔa̱a̱ri ti kueckɛ ŋɔak jak kä bit kɛ lätni cuŋni.","16":"Ciëŋɛ ala nɛy ti lɔr kä /cuarɛ lɔarun jak kä lät ti jiäk, kä duundɛ ɣöö ciëŋɛ ce̱tkɛ kuaany Kuɔth.","17":"Luɔ̱thɛ nɛy diaal. Nhɔakɛ dämuɔɔri tin la ji̱ ŋäthä. Dualɛ kɛ Kuoth. Luɔ̱thɛ kuäär in di̱i̱t.","18":"Kuaany, lua̱rɛ rɔ kua̱rkun kɛ luth mi di̱i̱t ɛlɔ̱ŋ, a /ci mɔ a kua̱r tin gɔw tin kɔ̱c lo̱ckiɛn kärɔ̱, amäni kua̱r tin ruac a jiäk.","19":"Ɛn nɔmɔ ba cuɔ̱ɔ̱ŋ kä ji̱ mi rut raan ti bɛ̈c bɛ̈ɛ̈c kɛ ɣöö tiimɛ Kuoth, a cäŋ cucɛ kɛ mi thil luɔt.","20":"Kɛ ɣöö mi ruutdi duäc kɛ ɣöö ci duer la̱t, ɛ luɔt ŋukä ci jek ɔ? Kä duundɛ ɣöö mi lät yɛn ni cuŋ, kä cia cuuc kɛ kui̱dɛ, ɛ min gɔaa ɛlɔ̱ŋ nhiam Kuɔth.","21":"Ca yɛ cɔl kɛ kui̱ kä mɛmɛ, kɛ ɣöö ci Kritho cuuc kɛ kui̱dun, kä cɛ yɛ ba̱ny nyuuth kɛ ɣöö bia guɔ̱ɔ̱r ni ciökɛ. 22 “Thilɛ duer mi cɛ la̱t, kä thilɛ ruac kacä mi ca met jek thokdɛ.”","23":"Mëë ca jɛ kuɛth /kenɛ naath luɔ̱c kuëth. Kä mëë ca jɛ yak, /kenɛ naath dhiät, kä duundɛ ɣöö cuɛ ŋäth ni Kuoth in la luk kɛ cuŋ.","24":"Jɛn puɔ̱nydɛ cɛ dueerkɔn kap, kɛ puɔ̱nydɛ mëë ca pua̱t jiaath, kɛ ɣöö bɛ kɔn lony a lɔr dueeri, kä banɛ tëk kɛ ciaŋ cuŋni. Ca yɛ jakä gɔw kɛ buɔ̱ɔ̱tkɛ.","25":"Kɛ ɣöö mëëdan ci yɛn bath dup ce̱tkɛ rɔɔm. Kä duundɛ ɣöö ɛn täämɛ cia luny ni kä yieen deet kä gääŋ tieynikun."},"headings":{"1":{"text":"Päm in tëk kɛnɛ do̱r in rɛl rɔ"},"11":{"text":"Tëkni ce̱tkɛ läät Kuɔth"},"18":{"text":"Nyuuth cucä Kritho"}}},"3":{"verses":{"1":"Kɛ jɛn duɔ̱ɔ̱p ɛmɔ män, lua̱rɛ rɔ cɔwkun, a cäŋ thilɛ tha̱a̱ŋkiɛn luth kɛ ruac Kuɔth. Kɛ ɣöö dɔ̱ŋ ba lo̱ckiɛn ri̱t ɛ ciɛŋ määnkiɛn a thil ruac,","2":"mi wäkɛ ciaŋ luthädun kɛ Kuoth kɛnɛ ciaŋ yupä pua̱a̱nydun wä nɛn. 3/Cuarɛ maandun jakä gɔaa raar kɛ ta̱k mi̱emkun kiɛ pi̱ek pua̱ny kɛ da̱a̱p, kiɛ kɛ läth bieyni da̱p da̱a̱p.","4":"Kä a maandun te rɛc lo̱cnikun. Kä a jɛ la gɔɔy mi kɔ̱c kɛnɛ yiëë mi bit, min tekɛ luɔt mi di̱i̱t nhiam Kuɔth.","5":"Kɛ jɛn duɔ̱ɔ̱p ɛmɔ, mëëdan cu män tin rɛ̈lkɛ rɔ̱ tin ci ŋa̱thdiɛn la̱th kä Kuoth rɔ pik kɛ maan ruac cɔɔnikiɛn nhɔk.","6":"Ɛ jɛn ta̱a̱ ëë tekɛ Thara mëë cuɛ A-bɛ-ram luɔ̱th a cɔlɛ jɛ i̱, “Kuäärä.” Kɛ yɛn nyieekɛ pa̱ny, mi lät yɛn ni cuɔ̱ɔ̱ŋ, kä thilɛ mi dual yɛn kɛ jɛ.","7":"Kɛ jɛn duɔ̱ɔ̱p ɛmɔ yɛn wutni, ciëŋɛ kɛɛl kɛ mänkun kɛ ŋäc mi gɔaa ɛn ɣöö kɛ nɛy ti kɔ̱c. Ciaŋɛ kɛ luthä, kɛ ɣöö nyuakɛ puɔ̱th teekä Kuɔth kɛɛl kɛ kɛ. La̱tdɛ nɔmɔ kɛ ɣöö thilɛ mi bi palun gaŋ.","8":"Kɛ jɔakdɛ bi yɛn diaal tekɛ mat rɛy yieekä, kɛnɛ ca̱r kɛl, kä nhɔakɛ rɔ ala ji̱ ciëŋ kɛ lo̱c ti kɔ̱c kɛnɛ cär ti mua̱l mua̱a̱l. 9/Cuarɛ mi jiääk col kɛ mi jiääk, kiɛ kuëth kɛ kuëth, kä duundɛ ɣöö cuɔ̱lɛ naath ni mi gɔaa. Kɛ ɣöö ca yɛ cɔl kɛ jɛn nɛmɛ, kɛ ɣöö dee yɛn puɔ̱th jek.","10":"Kä ca jɛ gɔ̱r i̱, “Ram mi go̱o̱r ɣöö bi lɔcdɛ tɛɛth kɛ tëk, kä go̱o̱rɛ ɣöö bɛ tekɛ ni̱n ti gɔw, a jɛ tiit lɛpdɛ kä ruac mi jiääk, kä a jɛ gaŋ thokdɛ kä lat ka̱a̱cni.","11":"A rɔ ri̱i̱tdɛ kä jiäk, kä a jɛ lät cuŋ. A jɛ go̱o̱r mal, kä a jɛ do̱tdɛ lɛɛr.","12":"Kɛ ɣöö waŋ Kua̱r ni Kuoth guɛcɛ ni ji̱ cuŋni, kä la ji̱thkɛ a lɛpɛ kɛ ɣöö bɛ paliɛn liŋ. Kä duundɛ ɣöö gak Kua̱r ni Kuoth kɛ nɛy tin la̱tkɛ jiäk.”","13":"Täämɛ, ɛŋa mi bi yɛ lät kä mi jiääk mi görɛ ni lätni kä mi gɔaa?","14":"A cäŋɛ mi cuc yɛn kɛ lätnidun kɛ ciaaŋ cuŋni, ba yɛ poth. /Cuarɛ dual kɛ min dual kɛ kɛ, kä /cuarɛ diɛɛr.","15":"Kä duundɛ ɣöö luɔ̱thɛ Kritho ala Kuäär ni Yecu rɛy lo̱cnikun. Ni ciaŋ rialɛ rɔ̱ ikä kɛ ɣöö bia tekɛ mi luc yɛn ɛ ram mi thieec yɛ kɛ ŋa̱th in tekɛ yɛ,","16":"kä latdɛ jɛ kɛ lɔc mi gɔaa mi tekɛ luth mi di̱i̱t. Jakɛ ca̱r lo̱cnikun kä buɔy, kɛ ɣöö mi cäŋ ca yɛ kuëth, bikɛ pöc kɛn nɛy tin ci ruac a jiäk kɛ kui̱ teekädun mi gɔaa rɛy Kritho.","17":"Mi go̱o̱r Kuoth ɛ ɛn ɣöö bia cuuc, gɔaa ni ɣöö bia cuuc kɛ lätni kä mi gɔaa, kä ɣöö bia cuuc kɛ lätni kä mi jiääk.","18":"Kɛ ɣöö ci Kritho cuuc bä kɛ duer ni kä kɛɛl kɛ nɛɛni diaal, ɛn ram mi gua̱n cuŋni cɛ cuuc kɛ kui̱ nɛɛni ti thil cuŋ, kɛ ɣöö bɛ yɛ naŋ nhiam Kuɔth. Cua puɔ̱nydɛ näk, kä cua jɛ jakä tëk kɛ yiëë.","19":"Kä kɛ ta̱a̱dɛ thi̱n kɛ yiëëdɛ cuɛ wä kɛ ɣöö bɛ ruac Kuɔth wä la̱t yiey tin te guäth yieenä.","20":"Kɛ yiey nɛɛni tëë /ka̱n Kuoth luɔ̱th mëëdan, mëë tëë li̱pä bitdä kɛ ni̱n tëë lät Nowa murkäbdɛ in di̱i̱t. Rɛy murkäbä cu nɛy ti tɔt ti pekdiɛn nɛy da̱ŋ bädäk kä rɔ̱, cukɛ kään thi̱n kɛ pi̱w.","21":"Kɛn pi̱w tɔ̱tɔ̱ kɛ nyuuth la̱k nath in ci yɛ kän täämɛ. Kä /ciɛ lak nitdä raar puɔ̱nydun, duundɛ ɣöö ɛ ruac mi ca la̱r Kuoth kɛ lo̱c ti gɔw min ci yɛ kän kɛ jiëc Yecu Kritho li̱th.","22":"Jɛn cɛ wä nhial a nyuurɛ cueec Kuɔth a ruaacɛ ja̱a̱k nhial, kɛnɛ kua̱r nhial diaal kɛnɛ bum."},"headings":{"1":{"text":"Män kɛnɛ cɔw"},"8":{"text":"Cuɔ̱c kɛ kui̱ lätni kä mi gɔaa"}}},"4":{"verses":{"1":"Kɛ kui̱ ɛmɔ mëë ci Kritho ti bɛ̈c bɛ̈ɛ̈c rut kɛ puɔ̱nydɛ, amäni yɛn bä buɔ̱mɛ rɔ, kɛ ca̱r mi ce̱tkɛ ca̱rɛ, kɛ ɣöö ram mi ci bɛ̈c bɛ̈ɛ̈c rut kɛ puɔ̱nydɛ /ci dueer lɛ ŋot thi̱n.","2":"Kä ɛn täämɛ a wä nhiam bi tha̱a̱ŋ teekädu wi̱i̱ muɔ̱ɔ̱n thuk kɛ ca̱r Kuɔth, a /ci mɔ a min go̱o̱r raan ɛ.","3":"Ci yɛn gua̱a̱th mi ro̱ŋ thuk kɛ lätni kä ti nhɔk Jur la̱tdiɛn, ci yɛn tëkdun thuk kɛ ciaŋ leerä, kɛnɛ lät jiäkni, kɛ yɔ̱ŋ kɔaaŋni, kɛnɛ ŋar baaŋ, kɛ lɔk, kɛ pa̱l kuthni guääyni.","4":"Cikɛ ga̱a̱c kɛ ɣöö /ken yɛn rɔ̱ ma̱t kɛ täämɛ rɛy ciɛɛŋä yäämädiɛn, kä inɔ kuëthkɛ yɛ.","5":"Kä duundɛ ɣöö bikɛ pek lätnikiɛn kuën ram min ci rɔ rialikä kɛ ɣöö bɛ nɛy tin tëk kɛnɛ nɛy tin ci li̱w luk.","6":"Ɛ jɛn min ca thuk ti gɔw la̱t nɛy tin ci li̱w bä kɛ jɛ, kɛ ɣöö cäŋ ca pua̱nykiɛn luk ce̱tkɛ min ca nɛy diaal luk, dɔ̱ŋ bikɛ cieŋ kɛ yiëë ce̱tkɛ Kuoth.","7":"Ci guut ŋɔaani diaal thia̱k, kɛ kui̱ ɛmɔ a wuɔ̱thkun ɣööŋ, kä ruɔ̱tdɛ rɔ̱ kɛ kui̱ palikun.","8":"Kä min di̱t ni jɛn kä ti diaal nhɔakɛ rɔ̱ kɛ nhök mi thuɔ̱k, kɛ ɣöö nhök kumɛ dueer ti ŋuan piny.","9":"Nyuɔ̱ɔ̱rɛ rɔ̱ agɔaa, a thil ŋɔa̱a̱ŋ.","10":"Ce̱tdɛ kɛ yuup mucni Kuɔth ti gööl, lua̱kɛ rɔ̱ kamnikun ram ɔ kɛ muc in cɛ jek.","11":"Ram mi ruac, a jɛ ruac ce̱tkɛ ram mi lat ni ruac Kuɔth. Kä ram mi lät naath ikä, a jɛ lät kɛ buɔ̱m min ci Kuoth ɛ ka̱m jɛ, kɛ ɣöö dëë Kuoth liak rɛy kä ti diaal kɛ Yecu Kritho. Kä buay kɛnɛ buɔ̱m kɛ nyinkɛ a thil pek. Inɔnɔ.","12":"Nhöökä, /cuarɛ ga̱a̱c kɛ riɛk mi bɛc bɛc mi bi tuɔɔk kä yɛ kɛ ɣɔ̱ndun, ce̱t tëëkɛ mi yi̱i̱c naath mi tuɔɔk kä yɛ.","13":"Kä a tɛth ni lo̱ckun ce̱tkɛ mi ruut yɛn bɛ̈c bɛ̈ɛ̈c Kritho kɛ jɛ kɛɛl, kɛ ɣöö dee lo̱ckun tɛɛth bä, mi wä buaydɛ wä jɔɔc.","14":"Mi ca yɛ kuëth kɛ kui̱ cio̱tdä Kritho, ca yɛ poth, kɛ ɣöö te yiëë buɔyä min la Yiëë Kuɔth kɛ yɛ.","15":"Kä duundɛ ɣöö a thil raan kä yɛ mi bi cuuc kɛ ɣöö ɛ nääk nath, kiɛ cuer, kiɛ gua̱n nyuɔɔni, kiɛ gua̱n wi̱eecni.","16":"Kä mi cuc raan kɛ ɣöö ɛ Krith-cin, /cuarɛ jɛ car i̱ ɛ pöc, kä liak ni Kuoth kɛ ɣöö cia ciöt ɛmɔ jek.","17":"Kɛ ɣöö ci gua̱a̱th cop kɛ ɣöö ba luk tok, kä ba jɛ tok kɛ ji̱ dhɔaar Kuɔth. Kä mi ba jɛ tok kɛ kɔn, kä bɛ kulɛ thuɔ̱k i̱di kɛ nɛy tin lökɛ thuk Kuɔth ti gɔw?","18":"Kä ci bok wee i̱, “Mi bumɛ ɛn ɣöö ba gua̱n cuŋni kän, bɛ kulɛ te i̱di kɛ raam mi thil Kuoth, mi gua̱n dueeri?”","19":"Kɛ kui̱ ɛmɔ a nɛy tin cuc ce̱tkɛ ruac Kuɔth akɛ la̱thkɛ rɔ̱ tetdä Cääkä in tekɛ ŋa̱th guäth in wäkɛ kɛ lätni gɔyni."},"headings":{"1":{"text":"Yuɔ̱ɔ̱p puthä Kuɔth"},"7":{"text":"Yuɔ̱p mucni Kuɔth agɔaa"},"12":{"text":"Cuɔ̱c ala Krith-cin"}}},"5":{"verses":{"1":"Ɛn täämɛ ta̱a̱kɛ mi bä la̱r yɛ ɛldɛri. Ɣän bä ɛ ɣän ɛldɛr puɔ̱nydä, kä ɛ ɣän neen cucä Kritho. Kä ɣän bä buay nyuak kɛɛl kɛ yɛ.","2":"Yienɛ det Kuɔth tin ca ka̱m yɛ, kä la̱tdɛ ce̱tkɛ yuɔ̱ɔ̱p ti gɔw. La̱tdɛ jɛ, kä /ciɛ ɣöö kuɔkɛ ni yɛ, ɛ ɣöö nhɔk yɛn ɛ i̱ bia jɛ la̱t ce̱tkɛ min go̱o̱r Kuoth ɛ. Kä /cuarɛ jɛ lät kɛ ɣöö bia yio̱w jek thi̱n, kä ɛ ɣöö go̱o̱r yɛnɛ i̱ bia jɛ la̱t kɛ lɔcdun kɛɛliw. 3/Cuarɛ jɛ go̱r ɛn ɣöö bi yɛn a ruëëckiɛn, duundɛ ɣöö jakä rɔ̱ kä nyuuth mi gɔaa kä kɛ.","4":"Kɛ ɣöö mi wä Yieen Deet in di̱i̱t wä jɔɔc bia kum kuäärä mi buɔy mi /ci bi met yaaw jek.","5":"Kɛ jɛn duɔ̱ɔ̱p ɛmɔ yɛn tin la ŋuɛ̈tni kɛn, nhɔakɛ ruac nɛɛni tin di̱t ni kɛn kä yɛ. Kä yɛn diaal la̱thɛ ni ciaŋ mi kɔ̱c kɔ̱c kɛ ɣöö bia rɔ̱ lätikä, kɛ ɣöö ci Ruac Kuɔth wee i̱, “Kuoth gaakɛ nɛy ti liakɛ rɔ̱, kä duundɛ ɣöö tho̱pɛ puɔ̱th ram mi kɔ̱c.”","6":"Kɛ kui̱ ɛmɔ jakɛ rɔ kä kuiy tetdä Kuɔth in bum, kɛ ɣöö bɛ yɛ kap nhial kɛ gua̱a̱th in lot rɔ.","7":"Ka̱mɛ jɛ ti diaal tin diɛrkɛ yɛ, kɛ ɣöö diɛɛrɛ kɛ kui̱dun.","8":"Ruɔ̱tdɛ rɔ̱ɔ̱dun, kä ta̱yɛ jinä. Gua̱n tɛ̈run in la gua̱n jiäkni wurɛ ce̱tkɛ lony mi ŋa̱a̱r kä go̱o̱rɛ ram mi bɛ roc. 9/Cuarɛ rɔ̱ luär jɛ, cuɔ̱ŋɛ a bum rɛy ŋäthädun kɛ ɣöö ŋa̱cɛ jɛ i̱ te dämuɔɔri rɛy ŋäthä diaal tin te wi̱i̱ muɔ̱ɔ̱n kɛn a rɛy cucä mi päär kɛ cuɔ̱c ɛmɛ.","10":"Kɛ kɔr kä mi cia cuuc kä mi tɔt, bi Kuoth in tekɛ puth diaal min ci yɛ cɔal rɛy buɔyädɛ min do̱raar rɛy Kritho, jɛn puɔ̱nydɛ bɛ yɛ luäk kä bɛ yɛ jakä bum, kä bɛ yɛ jakä cuŋ a bum.","11":"A buɔ̱m tekɛ jɛ amäni cäŋ kɛl. Inɔnɔ.","12":"Cä yɛ gɔ̱a̱r warɛgak ɛ ciɛk ɛmɛ kɛ luäk Thil-ba-näth, min caarä ɛn ɣöö ɛ dämandan mi ŋa̱a̱thä. Ɣän cuɔmä yɛ kä latdä ŋäcdä ɛn ɣöö nɛmɛ ɛ puɔ̱th Kuɔth in thuɔ̱k. Cuɔ̱ŋɛ rɛydɛ a bum.","13":"Kä ji̱ dolä Kuɔth in te kä Bɛ̈-bi-lɔn min ca mɛk ce̱tkɛ yɛ, ja̱kɛ yɛ kä maalɛ, kä nërkɛ yɛ ɛ gatdä ni Mak.","14":"Nërɛ rɔ kamnikun, kɛ ci̱em nho̱kä Krith-cini. A mal tekɛ yɛn diaal tin te rɛy Kritho."},"headings":{"1":{"text":"Yiëën deet Kuɔth"},"12":{"text":"Ner in jɔak"}}}},"2 Pit":{"1":{"verses":{"1":"Ɛ ɣän Thay-mɔn Pi-tɔr in la läät kä jak Yecu Kritho, gɔ̱a̱rä yɛ warɛgak ɛmɛ, yɛn nɛy tin ci ŋa̱th mi gɔaa mi ce̱tkɛ ŋa̱thda jek kɛ ciaŋ cuŋni Kuɔthdan kɛnɛ Käändan ni Yecu Kritho.","2":"A puɔ̱th kɛnɛ mal mi di̱i̱t tekɛ yɛ rɛy ŋäcä Kuɔth kɛnɛ Yecu in la Kuääran.","3":"Kä buɔ̱m kuoothä Kuɔth cɛ kɔn ka̱m ti diaal tin görnɛ kɛ kui̱ teekä ŋäthä mi thuɔ̱k kɛ ŋäcdan kɛ ram in cɔɔl kɔn kɛ buaydɛ kɛnɛ gɔɔydɛ.","4":"Kɛ kɛn muc ti̱ti̱ cɛ kɔn ka̱m mi di̱i̱t kɛnɛ muc tin di̱t gɔɔydiɛn ɛlɔ̱ŋ tin cɛ la̱r kɔn. Kɛ ɣöö kɛ kɛ dee yɛn kään kä nyuɔɔn in te wi̱i̱ muɔ̱ɔ̱n, min bä kɛ kui̱ di̱tdä lɔaac kɛ ti jiäk, kä dɔ̱ŋ dee yɛn te nyuaakä ciɛɛŋä Kuɔth in rɛl rɔ.","5":"Kɛ kui̱ ɛmɔ la̱tdɛ a bum kɛ ɣöö bia ŋa̱thdun rep kɛ ciaŋ mi gɔaa, kä bia ciaŋ mi gɔaa rep kɛ ŋäc ŋɔaani,","6":"kä bia ŋäc ŋɔaani rep kɛ ruɔ̱t lɔaac, kä bia ruɔ̱t lɔaac rep kɛ dhieel, kä bia dhieel rep kɛ ciaŋ luthä mi gɔaa,","7":"kä bia ciaŋ luthä mi gɔaa rep kɛ gɔɔydun kɛ gaatmuɔɔri, kä bia gɔɔydun kɛ gaatmuɔɔri rep kɛ nhök.","8":"Mi te ŋɔaani ti̱ti̱ rɛydun kä rëpkɛ rɔ̱ agɔaa, ba yɛ luäk kɛ ɣöö bi yɛn a nɛy ti gɔw ti tekɛ dɛy rɛy ŋäcä Kua̱ran ni Yecu Kritho.","9":"Kɛ ɣöö ram mi dak ŋɔaani ti̱ti̱ kä jɛ dak guecdɛ, kä ɛ cɔr, kä cɛ jɛ pa̱l ruëëc ɛn ɣöö ca jɛ lak kä dueerkɛ tëë kɔn.","10":"Kɛ kui̱ ɛmɔ, dämaari, ɣɔ̱a̱nɛ jɛ ɛlɔ̱ŋ ɛn ɣöö bia ciötdun kɛnɛ mëkdun kä Kuoth jakä thuɔ̱k, kɛ ɣöö mi wä yɛn ɛ la̱t /cia kɔ̱th bi kɔ̱thikä.","11":"Kɛ jɛn duɔ̱ɔ̱p ɛmɔ ba yɛ moc cuɔ̱ɔ̱ŋ kɛ ɣöö bia wä rɛy Kuäärä Kua̱ran kä Käändan ni Yecu Kritho mi do̱raar.","12":"Kɛ kui̱ ɛmɔ göörä jɛ ɛn ɣöö bä yɛ la ti̱emä ŋɔaani ti̱ti̱, a cäŋ ŋäc yɛn kɛ ni wen, kä ca yɛ yiath piny a bum rɛy thukä min bä kä yɛ.","13":"Caarä jɛ ɛ cuɔ̱ɔ̱ŋ kä ɣä ɛn ɣöö bäkɛ ti̱em yɛ min ŋuɔtdä kɛ tëk.","14":"Kɛ ɣöö ŋa̱cä jɛ ɛn ɣöö bä puɔ̱ny ɛmɛ ba̱ny piny ce̱tnikɛ min ci Kuääran ni Yecu Kritho jɛ la̱r ɣä a jɔc.","15":"Kä bä jɛ ɣɔ̱n ɛn ɣöö dee yɛn ŋɔaani ti̱ti̱ lɔ̱ tim gua̱thni diaal kɛ kɔr li̱ethdä.","16":"Kä mëë la̱rkɔ yɛ buɔ̱m benä Kua̱ran ni Yecu Kritho, /ci nɛy lät ni yɛ cäätni pɛlä ti ca la̱t ɛ raan. Kä duundɛ ɣöö kɔn cakɔ di̱t Yecu nɛn kɛ wäŋkɔ pa̱ny.","17":"Kɛ ɣöö cɛ luth kɛnɛ wuɔ̱t jek kä Kuoth in la Gua̱n, mëë ci jɔw Kuɔth ruac kɛ jɛ kɛ buaydɛ wëë i̱, “Nɛmɛ ɛ jɛn Gatdä min nhɔakä, in tɛth lɔcdä kɛ jɛ.”","18":"Kɔn pua̱nykɔ cakɔ jɔw ɛmɔ liŋ min bëë nhial, mëë ta̱kɔ wi̱i̱ pa̱a̱m mi rɛl rɔ kɛ jɛ kɛɛl.","19":"Kä cuɛ ruaacni göökni cu jakä thuɔ̱k kä kɔ. Gɔaa ɛ ɛn ɣöö bia ruac ɛmɛ dhil liŋ agɔaa, kɛ ɣöö ce̱tdɛ kɛ lɛmbär mi buɔy guäth mi col col, amäni mi ci ɣɔw baak kä ci cier bakä buay rɛy lo̱cnikun.","20":"Kɛ nhiam kä ti diaal bia nɛmɛ dhil ŋa̱c, ɛn ɣöö thilɛ ruac go̱o̱kä buɔk mi la ruac mi lat gök ɛ kärɔa.","21":"Kɛ ɣöö thilɛ ruac go̱o̱kä mi ci met tuɔɔk kä raan, duundɛ ɣöö ɛ Yiëë in Gɔaa in Rɛl Rɔ ɛn min kämkɛ ruac Kuɔth."},"headings":{"3":{"text":"Ciöt kɛnɛ kuëny"},"16":{"text":"Nëën waŋ buɔyä Kritho"}}},"2":{"verses":{"1":"Cu göök ka̱a̱cni rɔ jiɛc bä rɛy nath, ce̱tkɛ min bɛ tekɛ ŋi̱eec ka̱a̱cni rɛydun. Kɛn bikɛ ŋi̱i̱c mi kac mi bi naath bath ŋi̱eec. Kä bikɛ Ŋi̱i̱c in di̱i̱t, in ci kɛ luɛl jay, inɔ kɛn bikɛ rɔ̱ nöŋ da̱k kɛ pɛ̈th.","2":"Kä cäŋɛ jɛn inɔ bi nɛy ti ŋuan dup nyuɔɔnikiɛn guɔ̱ɔ̱r, kä kɛ kui̱diɛn ba duɔ̱ɔ̱p thukä lat jɔ̱ɔ̱r.","3":"Kä kɛn ŋi̱eec ka̱a̱cni ti̱ti̱ kɛ di̱t lɔaacdiɛn ba nyinkun pɛl kɛ ruaacni ka̱a̱cni. Kä luk ëë ca lar kɛ kui̱diɛn ni wal /ka̱n jɛ päl, kä /ken dääkdiɛn niɛɛn. 4/Ken Kuoth ja̱a̱k nhial tëë ci duer pälikä. Cuɛ kɛ yuɔr guäth maac mi thil pek, kä cuɛ kɛ jakä wä kɔ̱a̱kni ti cuɔl cuɔɔl, kɛ ɣöö ba kɛ gaŋ thi̱n amäni caŋ luɔ̱k 5/Ken Kuoth ɣɔw ëë wal päl, kä cuɛ Nowa mëë lat ruac kɛ kui̱ ciɛŋä cuŋni kän kɛnɛ nɛy da̱ŋ bärɔw kɔ̱kiɛn, mëë cɛ nyɔc nööŋ rɛy nɛɛni ti thil Kuoth.","6":"Ci Kuoth rɛk Thɔ-dɔm kɛnɛ Go-mo-ra waŋ a bikɛ a ŋɛ̈th. Kä cuɛ kɛ jakä nyuuth kɛ kui̱ kä min bi tuɔɔk kä ji̱ jiäkni ti thil Kuoth.","7":"Kä cuɛ Lɔt in la gua̱n cuŋni kän, mëë ca lɔcdɛ jakä jiɛth kɛ ciaŋ leerä nɛɛni ti jiäk,","8":"Cu wut ɛ gua̱n cuŋni nɔmɔ cieŋ rɛydiɛn, kɛ cäŋ kɛ cäŋ cu lɔcdɛ jiath kɛ kui̱ lätni tin jiäk tin cɛ nɛn kä cɛ liŋ.","9":"Kä inɔ ŋäc Kuoth ɛ ɛn ɣöö bɛ ji̱ cuŋni kän rɛy ɣɔ̱ɔ̱nikiɛn, kä bɛ nɛy tin thil Kuoth duäc amäni cäŋ luɔ̱k.","10":"Kä bɛ di̱t kä nɛy tin guɔ̱ɔ̱rkɛ ni tin go̱o̱r pua̱nykiɛn kɛ kɛnɛ nɛy tin lo̱k luth Kuɔth. Kɛn ŋi̱eec kacä ti̱ti̱ kɛn bumkɛ kä ruackɛ ni nyiäthä. /Cikɛ dual kɛ ɣöö bikɛ ja̱a̱k nhial ti gɔw lat jɔ̱ɔ̱r.","11":"Kä cäŋ ni min di̱t ni buɔ̱m ja̱a̱kni kɛnɛ lua̱ŋdiɛn kä kɛn ŋi̱eec kacä ti̱ti̱, /ken ja̱a̱k nhial kɛ gɔany kɛ kui̱ kuethni tɔ̱tɔ̱ nhiam Kua̱r ni Kuoth.","12":"Kä duundɛ ɣöö kɛn nɛy ti̱ti̱ la kɛn mi kui̱c kɛn ɛ a kueth. Kɛn ce̱t kɛn kɛ ley tin thil ca̱r rɛy lätnikiɛn, dapkɛ kɛ kɛ ɣöö bakɛ käp kä bakɛ näk. Mi wa ley ɛ tɔ̱ wä däk bakɛ däk bä.","13":"Kɛn bakɛ cuɔ̱l cuɔ̱c mi ce̱tkɛ cuɔ̱c ëë ci kɛn ɛ lät kä naath. Kä ca̱riɛn kɛ kui̱ tɛthä lɔaac ɛ ɣöö bikɛ yɔ̱ŋ kɛ cäŋ däär kɛɛliw. Kɛn kɛ pia̱ri kɛnɛ mɛ̈ɛ̈nyni, kɛn ŋarkɛ kɛ tɛ̈th lɔaac guäth in mi̱thkɛ kɛɛl kɛ yɛ.","14":"Kɛ wäŋ ti ci thia̱a̱ŋ kɛ dhöm, /ka̱n lätni dueeri ka̱p cuɔ̱ŋ. La buathkɛ nɛy tin kɔ̱c dui̱rä. Tekɛ kɛ lo̱c ti ca ŋi̱eec kɛ da̱r. Kɛ gaat ti ca bit!","15":"Kɛn ca duɔ̱ɔ̱p in cuŋ ba̱ny piny, cu bath ni kɛn, cukɛ guɔ̱ɔ̱r ni ciaŋ Bil-am gat Bɛ-or, min nhɔk ni kök kɛ kui̱ lätni ti jiäk.","16":"Kä cua jɛ luek kɛ duerɛ. Cu muul mi /cia ruac, ruac kɛ jɛ kɛ jɔw ran, kä cuɛ yɔ̱ŋ go̱kä nɔmɔ ka̱p cuɔ̱ŋ.","17":"Ce̱t nɛy ti̱ti̱ kɛ jieer ti thil pi̱ kɛnɛ pua̱a̱r ti lɔk thulkɛ. Ca gua̱a̱th mi col rialikä kɛ kui̱diɛn.","18":"Kɛn liakɛ rɔ̱ kɛ rieet ti thil luɔt, kɛ gör kä tin go̱o̱r puɔ̱nykɛ. Kɛn pɛlkɛ nɛy tin pay rɔ̱ bar kä nɛy tin guɔ̱ɔ̱rkɛ dup ti jek.","19":"Kä lät kɛn kɛ ɣöö bakɛ jakä lɔr, kä duundɛ ɣöö kɛn pua̱nykiɛn kɛ kuaany nyuɔɔni. Kä naath kɛ kuaany kä mɔ cikɛ tiam ɔ.","20":"Kä mi cikɛ rɔ̱ bar kä jiäk ɣɔaa ɛmɛ kɛ ŋäcdiɛn kɛ Kuääran kä Käändan ni Yecu Kritho, kä mi cakɛ nyɔk kɛ käp ɛ kɛn, kä cakɛ nyɔk kɛ tiëm, kɛn bi ciaaŋdiɛn ɛ jɔak ɛmɛ jiääk ni jɛn kä ciaaŋdiɛn ëë nhiam.","21":"Kä dee gɔaa ni jɛn kɛ kɛ ɛn ɣöö /ka̱n duɔ̱ɔ̱p ciɛŋä cuŋni kɔŋ ŋa̱c. Kä kɛ kɔr kä mi jɛ ŋa̱c, bɛ jiääk ɛlɔ̱ŋ ɛn ɣöö bikɛ rɔ̱ riet jɔk kä ŋut in rɛl rɔ min ca ka̱mkɛ.","22":"Cɛ tuɔɔk kä kɛ ce̱tkɛ min ca lat ɛ ruac pɛli i̱, “La jio̱k a loc kä min cɛ ŋɔk,” kä, “Kundhur mi ca lak la locɛ tuääk.”"},"headings":{"1":{"text":"Ŋi̱eec ka̱a̱cni"}}},"3":{"verses":{"1":"Nhöökä, nɛmɛ ɛ jɛn rɛw warɛgakä mëë cä gɔ̱a̱r yɛ. Kä rɛydiɛn kɛn da̱ŋ rɛw jiaacä ni ca̱run in gɔaa kɛ ti̱mdun ti̱ti̱.","2":"Göörä ɣöö bi yɛn ruaacni tëë ca lat ɛ göök tin rɛ̈lkɛ rɔ̱ tëë wal tim, kɛnɛ luëëk Kua̱r ni Yecu kä Kään mëë ca la̱t yɛ ɛ jaakun tin la ji̱ kɔaar Yecu.","3":"Bia nɛmɛ dhil ŋa̱c kɛ nhiam, ɛn ɣöö bi ji̱ boorä ben kɛ ni̱n tin jɔak, nɛy ti guɔ̱ɔ̱rkɛ ni di̱t lɔaacdiɛn kɛ tin go̱o̱r pua̱nykiɛn kɛ.","4":"Kä bikɛ wee i̱, “Ruac ëë cɛ lat kɛ kui̱ benä Yecu anikä? Kɛ ɣöö ni mëë ci gua̱ndɔɔŋnikɔ li̱w, ŋot ti diaal nikɛ ta̱a̱ ëë tekɛ kɛ ni mëë tuɔkɛ ɣɔw kɛ ca̱k!”","5":"Kä a ŋäc kɛn ɛ cukɛ thuɔ̱k ɛmɛ lo̱k, ɛn ɣöö mëëdan kɛ ruac Kuɔth cua nhial cak, kä cu piny päl raar rɛy pi̱i̱ni, kä cua jɛ da̱a̱k kɛ pi̱.","6":"Kä kɛ pi̱ cua ɣɔw gua̱th ëëdan luɔ̱ny pi̱ nyɔac, kä cuɛ jɛ däk.","7":"Kä kɛ jɛn riet Kuɔth ɔ kɛl ɔ, ca nhial kɛnɛ piny tin te thi̱n täämɛ kuëŋ go̱lä kɛ ɣöö bakɛ däk kɛ mac. Cakɛ tɔ̱w kɛ kui̱ ca̱ŋ luɔ̱k in di̱i̱t kɛnɛ däk nɛɛni tin thil luth kɛ Kuoth. 8 Kä duundɛ ɣöö yɛn nhöökä, /cuarɛ thuɔ̱k ɛmɛ päl ruëëc, ɛn ɣöö ce̱t cäŋ kɛl kɛ run ti bathdɔɔr kä Kuäär ni Kuoth, kä ce̱t run ti bathdɔɔr kɛ cäŋ kɛl kä jɛ. 9/Ci Kuäär ni Kuoth a niy niy kɛ min cɛ lar i̱ bɛ la̱t, ce̱tkɛ duɔ̱ɔ̱p in car tha̱a̱ŋ nath ɛ niy niiy. Kä duundɛ ɣöö päl Kuoth ni lɔcdɛ piny kɛ yɛ. Kɛ ɣöö /cɛ jɛ go̱r i̱ bi ram kɛl bath kä yɛ, go̱o̱rɛ ɣöö bi nɛy diaal rɔ ri̱t dueerikiɛn.","10":"Kä duundɛ ɣöö bi cäŋ Kua̱r ni Yecu ben ce̱tkɛ kueel, kä bi pua̱a̱r cu thil kɛ wuɔ̱w mi di̱i̱t, kä bi nyin nhial diaal waaŋ kɛ mac. Kä bi piny kɛnɛ ti diaal tin ca la̱t thi̱n, bikɛ pɛ̈t.","11":"Kɛ ɣöö bi ŋɔaani diaal ti̱ti̱ däk kɛ duɔ̱ɔ̱p ɛmɛ, kä bi yɛn ku la nɛy ti te i̱di? Gɔaaɛ ɛn ɣöö bia cieŋ kɛ ciaaŋ mi rɛl rɔ kä tekɛ luth Kuɔth.","12":"Liɛpɛ cäŋ Kuɔth kä jakɛ jɛ kä bëë kɛ pɛ̈th, kɛ jɛn cäŋ in ba nhial kɛɛliw dɔp a bɛ waaŋ, kä bi nyin nhial diaal cu lëër.","13":"Kä duundɛ ɣöö ce̱tkɛ ruacdɛ min ca lar liɛpnɛ ciëŋ nhial kɛnɛ piny tin pay cak, gua̱a̱th in cieŋ cuŋ thi̱n.","14":"Kɛ kui̱c ɛmɔ nhöökä, min liɛpɛ ŋɔaani ti̱ti̱, ɣɔ̱a̱nɛ jɛ ɛn ɣöö bi yɛn a wiɛc wiɛɛc ti thil bɛ̈ɛ̈l kä thil mɛ̈ɛ̈ny, kä ta̱yɛ kɛ mal kɛ Kuoth.","15":"Kä carɛ jɛ ɛn ɣöö päl lɔaac Kua̱ran piny ɛ jɛn la ka̱ndan ɔ. Ce̱tkɛ mëë ca gɔ̱a̱r yɛ ɛ dämandan min nhɔaknɛ ni Puɔl, kɛ pɛl ëë ca ka̱m jɛ.","16":"Cɛ gɔ̱a̱r kɛ kui̱ kä mɛmɛ rɛy warɛganikɛ diaal. Tëëkɛ tha̱a̱ŋ ŋɔaani rɛydiɛn ti bum luɔtdiɛn, ti ca lat ɛ nɛy ti kui̱c ŋu ti thil ca̱r ni dɔ̱ɔ̱rä kɛ kui̱ däkädiɛn, ce̱tkɛ min la kɛn jɛ a lät kä ruaacni Kuɔth tin kɔ̱ŋ.","17":"Yɛn nhöökä, kɛ ɣöö cia mɛmɛ kɔŋ ŋa̱c, niɛkɛ rɔ̱, kä a yɛ /ca bi böth jɔ̱ɔ̱r ɛ dueer nɛɛni tin lökɛ ŋut, a bia bath kä ŋa̱thdun.","18":"Kä duundɛ ɣöö piɛthɛ rɛy puthä kɛnɛ ŋäc Kua̱ran kä Käändan ni Yecu Kritho. A buay tekɛ jɛ ɛn täämɛ, amäni cäŋ kɛl. Inɔnɔ."},"headings":{"1":{"text":"Lär kɛ ben Kua̱r ni Yecu"}}}},"1 Jɔ̱ɔ̱n":{"1":{"verses":{"1":"Kɔn la̱rkɔ yɛ mëë te thi̱n ni tukä ɣɔaa, mëë cakɔ liŋ, kä cakɔ nɛn kɛ wäŋkɔ, mëë cakɔ guic kä cakɔ thiap kɛ tetkɔ, min la riet teekä.","2":"Ca tëk ɛmɔ jakä jɔc, kä cakɔ jɛ nɛn, kä cakɔ ruac kɛ kui̱dɛ, kä la̱rkɔ yɛ tëk in do̱raar mëë te kɛɛl kɛ Gua̱a̱r in te nhial, kä ca nyuɔ̱th kɔn.","3":"Ɛn min cakɔ nɛn kä cakɔ liŋ cakɔ jɛ la̱t yɛ bä, kɛ ɣöö dee yɛn tekɛ nyuaak kɛ kɔ kɛɛl. Kä nyuakdan tëë kɛɛl kɛ Gua̱a̱ra kɛnɛ Gatdɛ ni Yecu Kritho.","4":"Kä gɔ̱a̱rkɔ yɛ ti̱ti̱ kɛ ɣöö dee tɛ̈th lɔaacdan ro̱ŋ.","5":"Mɛmɛ ɛ jɛn ruac ëë cakɔ liŋ kä jɛ, kä la̱rkɔ jɛ yɛ, ɛn ɣöö Kuoth ɛ buay kä thilɛ muth mi te rɛydɛ.","6":"Mi laar kɔn ɛ ɛn ɣöö ta̱nɛ kɛ nyuaak kɛ jɛ, kä jäl kɔn rɛy muɔ̱th, kac kɔn ni kac, kä /ci kɔn lät ni thuɔ̱k.","7":"Kä mi jäl kɔn rɛy buɔyä, ce̱tkɛ min tëë rɛy buɔyä, ta̱nɛ kɛ nyuaak kamnikɔn, kä ci riɛm Gatdɛ ni Yecu dueerkɔn diaal lak raar.","8":"Mi laar kɔn ɛ ɛn ɣöö thilɛ kɔn duer, kaaŋ kɔn ni rɔ̱, kä /ci thuɔ̱k te rɛydan.","9":"Kä mi lat kɔn dueerkɔn, jɛn ram in gua̱n cuŋni min tekɛ ŋa̱th, bɛ kɔn pälikä kɛ dueerkɔn, kä bɛ kɔn lak kä nyuɔɔn diaal.","10":"Mi laar kɔn ɛ ɛn ɣöö /ka̱nkɔ duer, jak kɔn ni jɛ kä gua̱n kacä, kä /ci rietdɛ te rɛydan."},"headings":{"1":{"text":"Riet teekä"},"5":{"text":"Kuoth ɛ buay"}}},"2":{"verses":{"1":"Nyin tiɛtnikä, ɣän gɔ̱a̱rä yɛ ti̱ti̱ kɛ ɣöö /ci yɛn bi duer. Kä mi tëëkɛ ram mi ci duer, te kɔn kɛ ɣo̱o̱r kɛɛl kɛ Gua̱a̱ra ɛ jɛn Yecu Kritho in la gua̱n cuŋni.","2":"Kä ɛ jɛn muc in ca luɛl ni dueerkɔn, kä /ciɛ kui̱ dueerikɔn kärɔ̱, kä amäni dueer ɣɔaa diaal.","3":"Täämɛ kɛ nɛmɛ banɛ jɛ ŋa̱c ɛn ɣöö ŋäc kɔn Yecu, mi luɔ̱thnɛ luëëkɛ.","4":"Ram mi laar jɛ i̱, “Ɣän ŋa̱cä jɛ,” kä yärɛ luëëkɛ ɛ gua̱n kacä, kä ram mi ce̱tkɛ ɛnɔ /ci thuɔ̱k te rɛydɛ.","5":"Kä ram mi luth rietdɛ jɛn ram ɛmɔ ci nhök Kuɔth cop rɛydɛ kɛ thuɔ̱k. Banɛ jɛ ŋa̱c ɛn ɣöö te kɔn rɛydɛ kɛ nɛmɛ.","6":"Kä ram mi laar jɛ i̱, “Ta̱a̱ rɛy Yecu,” gɔaa ni ɣöö bɛ cieŋ kɛ ciaŋ ëë cieŋ kɛ Yecu.","7":"Nhöökä, /ciɛ luek mi pay tuɔɔk ɛ nɛ gɔ̱a̱rä yɛ mɛ, kä duundɛ ɣöö ɛ luek ëë wal, mëë tekɛ yɛ ni tukä ɣɔaa. Luek ëë wal ɛmɛ ɛ jɛn riet ëë cia kɔŋ liŋ.","8":"Kä täämɛ, gɔ̱a̱rä yɛ luek mi pay tuɔɔk bä, min la thuɔ̱k rɛy Yecu kɛnɛ rɛydun, kɛ ɣöö muth wee kɛ wä, kä ci buay in thuɔ̱k ku thuŋ lɛ̈p.","9":"Kä ram mi laar jɛ i̱, “Ta̱a̱ rɛy buɔyä,” kä nyiirɛ gaatman, ŋotdɛ rɛy muɔ̱th.","10":"Kä ram mi nhɔk gaatman, cieŋɛ rɛy buɔyä, kä rɛydɛ thilɛ mi dee radɔ̱diɛn jakä bɛ duer.","11":"Kä ram mi nyiir däman tëë rɛy muɔ̱th, kä jälɛ rɛy muɔ̱th, kä kui̱cɛ duɔ̱ɔ̱p mi wä kɛ jɛ, kɛ ɣöö ci muth nyinkɛ cɔr.","12":"Ɣän gɔ̱a̱rä yɛ mɛmɛ, nyin tiɛtnikä, kɛ ɣöö ca dueerkun päl kɛ kui̱ cio̱tädɛ.","13":"Ɣän gɔ̱a̱rä yɛ nɛmɛ, gua̱ni gan, kɛ ɣöö ŋäc yɛn ram ëë te thi̱n ni tukädɛ. Ɣän gɔ̱a̱rä yɛ nɛmɛ, ŋuɛ̈tni kɛ ɣöö cia gua̱n jiäkni puɔ̱t.","14":"Dho̱li gɔ̱a̱rä yɛ, kɛ ɣöö ŋäcɛ yɛ Gua̱a̱r in te nhial. Gua̱ni gan, gɔ̱a̱rä jɛ yɛ kɛ ɣöö ŋäc yɛn ram in te thi̱n ni tukädɛ. Ŋuɛ̈tni, gɔ̱a̱rä jɛ yɛ kɛ ɣöö ta̱yɛ kɛ buɔ̱m, kä cieŋ riet Kuɔth rɛydun, kä cia gua̱n jiäkni puɔ̱t. 15/Cuarɛ ɣɔw ɛ jiääk ɛmɛ nhɔk kiɛ ŋɔak tin te rɛy ɣɔaa. Nɛy tin nhɔakɛ ni ɣɔw ɛmɛ, /ci nhök Kuɔth in la Gua̱a̱r in te nhial te rɛydiɛn.","16":"Kɛ ɣöö ti diaal tin te rɛy ɣɔaa kɛ kɛn tin go̱o̱r puɔ̱nykɛ, kɛ ti go̱o̱r waŋ kɛ, kɛ kɛn tin liak naath rɔ̱ kɛ kɛ, bäkɛ kä ɣɔw ɛmɛ, /cikɛ bä kä Gua̱a̱r in te nhial.","17":"Ɣɔw kɛnɛ nyinkɛ bikɛ thuɔ̱k, kä duundɛ ɣöö nɛy tin la̱tkɛ ruac Kuɔth bikɛ tëk amäni cäŋ kɛl.","18":"Nyin tiɛtnikä, nɛmɛ ɛ jɛn thaak in jɔak! Kä ce̱tkɛ min cia jɛ liŋ ɛn ɣöö gua̱n tɛ̈r Kritho a bëëni, kä täämɛ ci ji̱ tɛ̈r Kritho ti ŋuan ben. Kɛ kui̱ ɛmɔ ŋäc kɔn ɛ ɛn ɣöö ɛ jɛn thaak in jɔak.","19":"Cikɛ jiɛɛn rɛydan, kä duundɛ ɣöö /cikɛ te kɛɛl kɛ kɔn. Duŋ mi tekɛ kɛɛl kɛ kɔn, dee kɛ ŋot kɛɛl kɛ kɔn. Kä kɛ wädiɛn raar, cɛ jɔɔc ɛn ɣöö /ci kɛn diaal te kɛɛl kɛ kɔn.","20":"Kä ca yɛ mɛk ɛ Kɛl in Gɔaa in Rɛl Rɔ, kä ci yɛn diaal thuɔ̱k ŋa̱c. 21/Cä gɔ̱r yɛ /ciɛ ɣöö kui̱c yɛn thuɔ̱k, ɛ ɣöö ŋa̱cɛ jɛ, kä ŋa̱cɛ ɣöö thilɛ kac mi bëë raar rɛy thukä.","22":"Ɛŋa mi la gua̱n kacä /ciɛ ram mi gaak jɛ ɛn ɣöö Yecu /ciɛ Kritho? Ram ɛmɔ ɛ jɛn gua̱n tɛ̈r Kritho, jɛn ram mi gaak Gua̱a̱r in te nhial kɛnɛ Gatdɛ.","23":"Thilɛ ram mi gaak Gat mi tëë Gua̱n. Kä ram mi lat ŋäcdɛ kɛ Gat Kuɔth tëëkɛ Gua̱n bä.","24":"Jakɛ mëë ci yɛn ɛ liŋ ni tukä kä cieŋ rɛy lo̱cnikun. Mi wä min cia liŋ ni tukädɛ wä cieŋ rɛy lo̱cnikun bia cieŋ rɛy Gatdä Kuɔth kɛnɛ rɛy Gua̱n.","25":"Kä min cɛ la̱r kɔn, ɛ tëk mi thil pek.","26":"Ɣän gɔ̱a̱rä yɛ mɛmɛ kɛ kui̱ nɛɛni tin dee yɛ kaŋ.","27":"Kɛ kui̱dun, ɛn mëk in ca mɛk ni yɛ min cieŋ rɛydun, /ci yɛn radɔ̱diɛn go̱r mi dee yɛ ŋi̱eec. Mëkdɛ kɛ yɛ ŋi̱i̱cɛ yɛ kɛ ti diaal, kä ɛ thuɔ̱k, /ciɛ kac. Kä ce̱tkɛ min cɛ yɛ ŋi̱eec, ciëŋɛ rɛydɛ.","28":"Kä täämɛ, nyin tiɛtnikä, ciëŋɛ rɛydɛ, kɛ ɣöö mi wëë wä jɔɔc dee kɔn tekɛ ŋa̱th, kä /canɛ bi pöc nhiamdɛ mi wëë wä ben.","29":"Mi ŋäc yɛn ɛ ɛn ɣöö ɛ gua̱n cuŋni, bi yɛn ɛ ŋa̱c a thil diw ɛn ɣöö nɛy diaal tin la̱tkɛ cuŋ kɛ gaat Kuɔth."},"headings":{"1":{"text":"Kritho ɛ luääkdan"},"7":{"text":"Mat ruac mi pay tuɔɔk"},"18":{"text":"Gua̱n tɛ̈r Kritho"}}},"3":{"verses":{"1":"Nɛ̈nɛ jɛ, ɛ nhök mi te i̱di ci Gua̱a̱r in te nhial ɛ nhɔk ni kɔn ɛ, a cɔalkɛ kɔn i̱ gaat Kuɔth. Kä kɛ kɛn gaatkɛ. Luɔt kä min kui̱c ɣɔw ɛ ni kɔn ɛ jɛn ɣöö kui̱ ɣɔw ɛ.","2":"Nhöökä, ɛn täämɛ lapnɛ gaat Kuɔth, kä ŋotdɛ /ken ta̱a̱ in bi tekɛ kɔn in jɔɔc. Kä min ŋa̱cnɛ ɛ ɣöö, mi wëë wä jɔɔc banɛ ce̱tkɛ jɛ, kɛ ɣöö banɛ jɛ nɛn kɛ ta̱a̱ in tekɛ jɛ.","3":"Nɛy diaal tin ŋa̱thkɛ bendɛ, bikɛ rɔ̱ jakä wiɛc wiɛɛc ce̱tkɛ min jɛn ɛ wic wic.","4":"Nɛy diaal tin la̱tkɛ dueer cikɛ duer kɛ to̱l ŋuɔ̱tni, kɛ ɣöö duer ɛ jɛn to̱l ŋuɔ̱tni.","5":"Ŋäc yɛn ɛ ɛn ɣöö ci Yecu jɔɔc kɛ ɣöö bɛ dueer woc, kä rɛydɛ thilɛ duer.","6":"Thilɛ ram mi cieŋ rɛydɛ mi dui̱r, kä thilɛ ram mi lät dui̱r, mi ci Yecu nɛn kiɛ cɛ jɛ ŋa̱c.","7":"Nyin tiɛtnikä, a thil ram mi kaaŋ yɛ. Ram ɔ lät cuŋ ɔ jɛn ɛ gua̱n cuŋni, ce̱tkɛ min Yecu ɛ gua̱n cuŋni.","8":"Ram mi lät dueer, ɛ gat gua̱n jiäkni, kɛ ɣöö gua̱n jiäkni lätdɛ duer ni tukä. Luɔt ëë jɔc kɛ Gat Kuɔth ɛ ɣöö bɛ lät gua̱n jiäkni däk.","9":"Thilɛ ram mi ca di̱eth ɛ Kuoth mi lät duer, kɛ ɣöö te ciaŋ Kuɔth rɛydun, kä /cikɛ dee duer, kɛ ɣöö diëth kɛ kɛ ɛ Kuoth.","10":"Dëë gaat Kuɔth kɛnɛ gaat gua̱n jiäkni ŋic kɛ nɛmɛ. Nɛy diaal tin /ci lät ni cuŋ, /cikɛ nɛɛ Kuɔth, amäni nɛy tin /ca dämani nhɔk.","11":"Kɛ ɣöö nɛmɛ ɛ jɛn ruac ëë ci yɛn ɛ liŋ ni tukä, ɛn ɣöö banɛ rɔ̱ nhɔk.","12":"Kä /canɛ bi ce̱tkɛ Këën ëë la raan gua̱n jiäkni, kä cuɛ däman näk. Kä ɛŋu näkɛ jɛ mɔ? Ɛ ɣöö jiäk lätkɛ kä gɔw lät däman. 13/Cuarɛ ga̱a̱c dämaari, kɛ ɣöö nyir ɣɔw yɛ.","14":"Ŋa̱cnɛ jɛ ɛn ɣöö canɛ jiɛɛn li̱th, kä canɛ ben teekä, kɛ ɣöö nhɔaknɛ rɔ̱. Jɛn mi /ci naath nhɔk, ŋotdɛ li̱th.","15":"Ram mi nyir däman jɛn ɛ luuc nath, kä ŋäc yɛn ɛ ɛn ɣöö thilɛ luɔ̱ɔ̱c nath ti te rɛydiɛn kɛ tëk mi do̱raar.","16":"Ŋa̱cnɛ nhök kɛ nɛmɛ, kɛ ɣöö ci Yecu tëkdɛ thöp kɛ kui̱dan, kä banɛ tëkdan lɛ thöp kɛ kui̱ dämanikɔn.","17":"Kä dee nhök Kuɔth te rɛy ran i̱di mi te raan kɛ ŋɔak wi̱i̱ muɔ̱ɔ̱n ɛmɛ, kä nɛɛnɛ gaatman görkɛ duɔ̱ɔ̱r, kä lo̱kɛ ɣöö bɛ kɛ moc?","18":"Nyin tiɛtnikä, /cuanɛ naath nhɔk kɛ nhök lɛc kiɛ ruac baaŋ, nhɔaknɛ rɔ kɛ lät kɛnɛ thuɔ̱k.","19":"Kä kɛ nɛmɛ banɛ jɛ ŋa̱c ɛn ɣöö lapnɛ ji̱ thuɔ̱ɔ̱kni kä banɛ lo̱ckɔn lɛni jakä bum nhiamdɛ,","20":"gua̱thni diaal tin ci lo̱ckɔn kɔn moc kɛ duer ɔ. Kɛ ɣöö di̱t ni Kuoth kä lo̱ckɔn, kä ŋäcɛ ti diaal.","21":"Nhöökä, mi /ken lo̱ckɔn kɔn moc duer, liaknɛ rɔ̱ nhiam Kuɔth.","22":"Kä canɛ min canɛ thiec kä jɛ jek, kɛ ɣöö luɔ̱thnɛ luëëkɛ, kä la̱tnɛ ni min jak lɔcdɛ kä tɛth.","23":"Kä nɛmɛ ɛ jɛn luekdɛ, kɛ ɣöö banɛ ciöt Gatdɛ ni Yecu Kritho ŋäth, kä banɛ rɔ nhɔk, ce̱tkɛ min cɛ la̱r kɔn.","24":"Nɛy diaal ti luɔ̱thkɛ luëëkɛ cieŋkɛ rɛydɛ, kä cieŋɛ rɛydiɛn. Ŋäc kɔn ɛ ɛn ɣöö cieŋɛ rɛydan kɛ nɔmɔ, kɛ Yiëë in cɛ ka̱m kɔn."},"headings":{"1":{"text":"Gaat Kuɔth"},"11":{"text":"Nhɔakɛ rɔ̱"}}},"4":{"verses":{"1":"Nhöökä, /cuarɛ yiey diaal ŋäth. Ɣɔ̱a̱nɛ yiey kɛ ɣöö bia nɛn mi kɛ yiey ti bä kä Kuoth, kɛ ɣöö ci göök kacä ti ŋuan däk wi̱i̱ muɔ̱ɔ̱n.","2":"Bia Yiëë Kuɔth ŋa̱c kɛ nɛmɛ. Yiey diaal tin bi jɛ lat ɛn ɣöö ci Yecu Kritho ben kɛ puɔ̱ny ran kɛ yiey ti bä kä Kuoth.","3":"Kä yiey diaal tin /ca jɛ bi lat ɛn ɣöö Yecu cɛ ben kɛ puɔ̱ny, /cikɛ yiey ti bä kä Kuoth. Nɛmɛ ɛ jɛn ciaŋ gua̱n tɛ̈r Kritho in ci yɛn ɛ liŋ i̱ bi ben, kä ɛn täämɛ jɛn a rɛy ɣɔaa.","4":"Nyin tiɛtnikä, bä yɛn kä Kuoth, kä ci yɛn yiey tɔ̱tɔ̱ puɔ̱t, kɛ ɣöö di̱t ni jɛn ram in te rɛydun kä ram in te rɛy ɣɔaa.","5":"Kɛn kɛ ji̱ ɣɔaa, kɛ kui̱ ɛmɔ min lat kɛn ɛ ɛ duŋ ɣɔaa, kä liŋ ɣɔw kɛ.","6":"Kɔn lapnɛ ji̱ Kuɔth. Kä ram ɔ ŋäc Kuoth ɔ liŋɛ ruaacnikɔn, kä ram ɔ /ci bä kä Kuoth ɔ, /cɛ kɔn liŋ. Kä kɛ nɛmɛ ŋäc kɔn yiëë thukä kɛnɛ yiëë mi /ci mɔ a thuɔ̱k.","7":"Nhöökä, kuanɛ rɔ nhɔk, kɛ ɣöö nhök bëë kä Kuoth, kɛ ɣöö ram mi nhɔk naath di̱eth ɛ Kuoth, kä ŋäcɛ Kuoth.","8":"Kä ram mi /ci naath nhɔk, kui̱cɛ Kuoth kɛ ɣöö Kuoth ɛ nhök.","9":"Kä nhök Kuɔth ca jɛ nyuɔ̱th kɔn kɛ duɔ̱ɔ̱p ɛmɛ, kɛ ɣöö ci Kuoth Gatdɛ min kɛl kärɔa jäkä wi̱i̱ muɔ̱ɔ̱n, kɛ ɣöö dënɛ tëk kɛ jɛ.","10":"Te nhök rɛy kä nɛmɛ, /ciɛ ɣöö nhɔaknɛ Kuoth, kä ɛ ɣöö nhɔk Kuoth kɔn, kä cɛ Gatdɛ ja̱k ala muc mi luɛlɛ ni dueerkɔn.","11":"Nhöökä, min nhɔk Kuoth kɔn ɛlɔ̱ŋ, gɔaa ni ɣöö banɛ rɔ nhɔk bä.","12":"Thilɛ ram mi ci Kuoth met nɛn, mi nhɔak nɛ rɔ, cieŋ Kuoth rɛydan, kä nhökdɛ ro̱ŋɛ rɛydan.","13":"Kä nɛmɛ ŋäc kɔn ɛ ɛn ɣöö cieŋ kɔn rɛydɛ kä tëë rɛydan, kɛ ɣöö cɛ kɔn ka̱m Yiëëdɛ.","14":"Kä canɛ jɛ nɛn, kä lat kɔn ɛ ɛn ɣöö ci Gua̱a̱r in te nhial Gatdɛ ja̱k ala Kään ɣɔaa.","15":"Cieŋ Kuoth rɛy ram mi laar jɛ ɛn ɣöö Yecu ɛ Gat Kuɔth, kä tëë rɛy Kuɔth.","16":"Kä ɛnɔ ŋäc kɔn kä ŋääth kɔn nhök in nhɔk Kuoth ɛ ni kɔn. Kuoth ɛ nhök, kä nɛy tin cieŋ rɛy nho̱kä cieŋkɛ rɛy Kuɔth, kä cieŋ Kuoth rɛydiɛn.","17":"Ci nhök ro̱ŋ rɛydan kɛ nɛmɛ, ɛn ɣöö dënɛ tekɛ liak kɛ cäŋ luɔ̱k in di̱i̱t, kɛ ɣöö ce̱t ta̱a̱dan wi̱i̱ muɔ̱ɔ̱n ɛmɛ kɛ ta̱a̱ in tekɛ jɛ.","18":"Thilɛ nhök rɛydɛ dual, kä nhök mi thuɔ̱k dhiacɛ dual raar. Kɛ ɣöö dual no̱o̱ŋɛ duäc, kä ram mi dual /kenɛ ro̱ŋ kɛ nhök.","19":"Nho̱k kɔn, kɛ ɣöö cɛ kɔn nhɔk kɛ nhiam.","20":"Kä nɛy tin wee i̱, “Nhɔakä Kuoth,” kä nyiɛrkɛ dämani, kɛ ji̱ kacä, kɛ ɣöö nɛy ti /ci dämani tin nɛɛn kɛn kɛ nhɔk, /cikɛ Kuoth in /ka̱n met nɛn dee nhɔk.","21":"Kä luek in cɛ ka̱m kɔn ɛn. Nɛy tin nhɔakɛ Kuoth bikɛ dämani dhil nhɔk bä."},"headings":{"1":{"text":"Yiëë mi thuɔ̱k kɛnɛ mi kac"},"7":{"text":"Kuoth ɛ nhök"}}},"5":{"verses":{"1":"Nɛy diaal ti ŋa̱thkɛ jɛ ɛn ɣöö Yecu ɛ jɛn Kritho, kɛ gaat Kuɔth. Kä ram mi nhɔk gua̱n, nhɔkɛ gatdɛ bä.","2":"Kɛ jɛn duɔ̱ɔ̱p ɛmɔ ŋa̱cnɛ jɛ ɛn ɣöö nhɔaknɛ gaat Kuɔth, mi nhɔaknɛ Kuoth kä luth kɔn luëëkɛ.","3":"Kä nhök Kuɔth ɛ jɛn nɛmɛ, banɛ luëëkɛ luɔ̱th. Kä luëëkɛ /cikɛ naath cuc.","4":"Kɛ ɣöö gat mi bä kä Kuoth jɛn tiamɛ ɣɔw. Kä min tiamɛ ni ɣɔw, ɛ ŋa̱thdan.","5":"Ɛŋa mi dee ɣɔw tiam a /ci mɔ a ram mi ŋääth jɛ ɛn ɣöö Yecu ɛ jɛn Gat Kuɔth?","6":"Ram ëë bä kɛ pi̱ la̱kdɛ kɛnɛ riɛm li̱ethdɛ ɛ jɛn Yecu Kritho. /Kenɛ ben kɛ pi̱ kärɔ̱, cɛ ben kɛ pi̱ kɛnɛ riɛm. Kä ɛ Yiëë lat nën ɔ, kɛ ɣöö Yiëë ɛ thuɔ̱k.","7":"Kä te nëën da̱ŋ diɔ̱k ti̱ti̱ thi̱n","8":"Yiëë, kɛnɛ pi̱, kɛ riɛm, kä kɛn diɔ̱k ti̱ti̱ cikɛ mat kɛɛl.","9":"Kä mi nhɔk kɔn nën nath, kä di̱t ni nën in lat Kuoth ɛ, kɛ ɣöö ɛ nën Kuɔth in cɛ lat kɛ kui̱ Gatdɛ.","10":"Kɛ ɣöö nɛy tin ŋa̱thkɛ Gat Kuɔth tekɛ kɛ nën rɛydiɛn. Kä nɛy tin /ci Kuoth ŋäth, jakä ni jɛ kä gua̱n kacä, kɛ ɣöö /cikɛ nën in ci Kuoth ɛ lar kɛ kui̱ Gatdɛ ŋäth.","11":"Kä nɛmɛ ɛ jɛn nën. Ɛ ɣöö ci Kuoth kɔn ka̱m tëk mi do̱raar, kä tëk ɛmɛ tëë rɛy Gatdɛ.","12":"Ram mi tekɛ Gat Kuɔth tëëkɛ tëk ɛmɛ. Kä ram mi /ci tekɛ Gat Kuɔth, thilɛ jɛ tëk ɛmɛ.","13":"Ɣän gɔ̱a̱rä mɛmɛ yɛ, yɛn nɛy tin ŋa̱thkɛ ciöt Gatdä Kuɔth, kɛ ɣöö dërɛ jɛ ŋa̱c ɛn ɣöö ta̱yɛ kɛ tëk mi do̱raar.","14":"Kä min la liakdan kä jɛ ɛ jɛn mɛmɛ, ɛ ɣöö mi thiec kɔn ɛ kɛ ŋɔak ti luɔtkɛ rɔ kɛ ruacdɛ la liŋɛ kɔn.","15":"Kä mi ŋa̱cnɛ jɛ ɛn ɣöö liŋɛ kɔn kɛ ti diaal tin thiëcnɛ kä jɛ, la ŋa̱cnɛ jɛ ɛn ɣöö canɛ tin ca thiec kä jɛ jek.","16":"Mi ci raan däman nɛn a lätdɛ duer, mi /ci jɛ bi dhiɛl li̱th, thiec Kuoth kä bi Kuoth ram ɛmɛ moc tëk, ruacä kɛ kui̱ nɛɛni ti /ci dueriɛn kɛ bi giɛk li̱th. Tëëkɛ duer mi gik raan li̱th. /Cä lar ni ɣöö bi raan pal kɛ kui̱ kä nɔmɔ.","17":"La̱t nyuɔɔni ɛ duer, kä duundɛ ɣöö tëëkɛ duer mi /ci raan dee dhiɛl li̱th.","18":"Ŋäc kɔn ɛ ɛn ɣöö nɛy tin ca di̱eth ɛ Kuoth /cikɛ duer lät, kä duundɛ ɣöö gaŋ Gat Kuoth kɛ, kä /ci gua̱n jiäkni kɛ gueer.","19":"Ŋäc kɔnɛ ɛn ɣöö lapnɛ gaat Kuɔth kä te ɣɔw ɛmɛ kɛɛliw piny bumä gua̱n jiäkni.","20":"Kä ŋäc kɔn ɛ bä ɛn ɣöö ci Gat Kuɔth ben, kä cɛ kɔn ka̱m ŋäc ŋɔaani kɛ ɣöö dënɛ jɛ ŋa̱c jɛn ram in thuɔ̱k. Kä ta̱nɛ rɛydɛ jɛn min la thuɔ̱k, Gatdɛ ni Yecu Kritho. Kä ɛ jɛn Kuoth in thuɔ̱k, kä ɛ tëk in do̱raar.","21":"Nyin tiɛtnikä, tiɛtdɛ rɔ̱ kä kuth guäyni diaal."},"headings":{"1":{"text":"Tiëmdan kɛ ɣɔw"},"6":{"text":"Ruac nenä kɛ kui̱ Yecu Kritho"},"13":{"text":"Tëk mi do̱raar"}}}},"2 Jɔ̱ɔ̱n":{"1":{"verses":{"1":"Ɛ ɣän ɛldɛr gɔ̱a̱rä warɛgak ɛmɛ ciek mi ca mɛk, kɛnɛ gaatkɛ, tin nhɔakä rɛy thukä, kä /ciɛ ɣän kärɔa, amäni nɛy diaal tin ŋa̱ckɛ thuɔ̱k bä,","2":"kɛ kui̱ thukä min te rɛyda, kä bɛ tekɛ kɔ kɛɛl a thil pek.","3":"A puɔ̱th kɛnɛ kɔ̱a̱c lɔaac kɛ mat tin bä kä Kuoth in la Gua̱a̱ra kɛnɛ Gatdɛ ni Yecu Kritho tekɛ kɔn rɛy thukä kɛnɛ nhök.","4":"Ci lɔcdä tɛɛth ɛlɔ̱ŋ, mëë cä tha̱a̱ŋ gankun jek guɔ̱ɔ̱rkɛ thuɔ̱k ce̱tkɛ mëë ci Gua̱a̱ra ɛ la̱t kɔn.","5":"Kä täämɛ, nyimaar, ɣän la̱ŋä ji̱, /cä gɔ̱r ni ji̱ luek mi pay jek, gɔ̱a̱rä ji̱ luek ëë tekɛ kɔn nikɛ nhiam ɛn ɣöö banɛ rɔ nhɔk.","6":"Nɛmɛ ɛ jɛn nhök, ɛn min guɔ̱ɔ̱rnɛ ce̱tkɛ ruacdɛ min cɛ lat. Kä nɛmɛ ɛ jɛn ruacdɛ, ce̱tkɛ mëë cia jɛ liŋ kɛ nhiam ɛn ɣöö bi yɛn nhök guɔ̱ɔ̱r.","7":"Cu ji̱ mɛɛtdä ti ŋuan wä raar wi̱i̱ muɔ̱ɔ̱n, kɛn nɛy tin lökɛ ɣöö Yecu Kritho ɛ raan. Ram mi ce̱tkɛ nɔmɔ ɛ gua̱n mɛɛtdä kä ɛ lo̱o̱k Kritho!","8":"Niɛkɛ rɔ, kɛ ɣöö /ci tin cia la̱t bi bath, kä duundɛ ɣöö bia jek ni muc mi gɔaa kɛɛliw.","9":"Ram mi bääl ŋi̱i̱c Kritho, thilɛ jɛ Kuoth, kä ram mi guur ŋi̱i̱c Kritho, te Gua̱a̱r in te nhial kɛnɛ Gatdɛ kɛ jɛ.","10":"Mi tëëkɛ ram kɛl mi ci ben kä yɛ, kä /cɛ ŋi̱i̱c ɛmɛ no̱ŋ yɛ, /cuarɛ jɛ nyuur, kä /cuarɛ jɛ nho̱k ben dueel.","11":"Kɛ ɣöö ram mi wä jɛ wä nyuɔ̱ɔ̱r, nyuak kɛn ciaaŋdɛ mi jiääk.","12":"Cäŋ ta̱a̱ kɛ ti ŋuan ti dëë gɔ̱a̱r yɛ, /ci ɣän ɛ go̱r ɛn ɣöö bä kɛ gɔ̱r kɛ warɛgak kɛnɛ galam. Ɣän göörä ni ɣöö bä yɛ ben gui̱l, kä bä ruac kɛ yɛ a guɛc nɛ rɔ̱, kɛ ɣöö dee tɛ̈th lɔaacdä cu ro̱ŋ.","13":"Gaat nyimuɔɔrun in ca mɛk nërkɛ yɛ."},"headings":{"4":{"text":"Thuɔ̱k kɛnɛ nhök"},"12":{"text":"Rieet tin jɔak"}}}},"3 Jɔ̱ɔ̱n":{"1":{"verses":{"1":"Ɛ ɣän ɛldɛr gɔ̱a̱rä warɛgak ɛmɛ dämaar ni Gay-äth, min nhɔakä kɛ thuɔ̱k.","2":"Määthdä, ɣän palä kɛ ɣöö bi ŋɔak diaal gɔw kɛ ji̱ kä bi puɔ̱nydu pual, ce̱tkɛ min ŋa̱cä jɛ ɛn ɣöö gɔaa yiëëdu.","3":"Kä ci lɔcdä tɛɛth ɛlɔ̱ŋ, mëë ci tha̱a̱ŋ dämanikɔn cop kä ruackɛ kɛ kui̱ ciɛŋä teekädu in thuɔ̱k, ce̱tkɛ min guuri thuɔ̱k.","4":"Kä thilɛ ɣä tɛ̈th lɔaac mi leny nɛmɛ, ɛn ɣöö liɛŋä jɛ i̱ guur gaatkä ni thuɔ̱k pa̱ny.","5":"Määthdä mi nhɔakä, ɛ mi gɔaa ɛn ɣöö ci dämanikɔn rɛy Kritho luäk, a cäŋ ni mɔ kɛ jur kä ji̱ mɔ.","6":"Cikɛ nhökdu lat nhiam ji̱ duëël Kuɔth. Luäki kɛ ɣöö bikɛ ja̱liɛn cuɔ̱p kɛ duɔ̱ɔ̱p mi bi lɔc Kuɔth tɛth.","7":"Cu nɛy ti̱ti̱ tɛth piny kɛ kui̱ cio̱tdä Yecu, kä thilɛ mi ci kɛn ɛ nhɔk kä jur tin thil ŋa̱th.","8":"Kɛ kui̱c ɛmɔ, gɔaa ni ɣöö banɛ wutni ti ce̱tkɛ ti̱ti̱ luäk, kɛ ɣöö dee kɔn a ji̱ la̱t kɛ kɛ kɛɛl rɛy thukä.","9":"Cä duɔ̱ɔ̱r gɔ̱a̱r kä ji̱ duëël Kuɔth, kä Day-ɔt-rɛ-pith min go̱o̱r ɣöö bi rɔɔdɛ jakä bo̱o̱thdiɛn, /cɛ ruacdä bi nhɔk.","10":"Kɛ kui̱c ɛmɔ, mi wa̱a̱ wä ben, bä mɔ latdɛ mɔ ben nɛn, mɔ latdɛ ruaacni kacä kɛ kui̱dan ɔ. Kä mi di̱t ni jɛn ɛ ɣöö, jɛn puɔ̱nydɛ lo̱kɛ jɛ i̱ bɛ dämanikɔn nyuɔ̱ɔ̱r, kä penɛ kɛ nɛy tin görkɛ ɣöö dëë kɛ nyuɔ̱ɔ̱r, kä tukɛ kɛ raar dueel Kuɔth.","11":"Määthdä min nhɔakä, cu nyiɛth ni mi jiääk, nyiɛthni ni mi gɔaa. Ram mi lät mi gɔaa ɛ raan Kuɔth. Kä ram mi lät mi jiääk /kenɛ Kuoth nɛn.","12":"Kä ruac nɛy ti ŋuan kɛ kui̱ Di-mi-triäth, kä gɔaa kɛ̈kdɛ kɛ thuɔ̱k. Liak kɔ jɛ bä, kä ŋäc yɛn ɛ ɛn ɣöö ruacda ɛ thuɔ̱k.","13":"Ɣän ta̱a̱kɛ ti ŋuan ti dëë gɔ̱a̱r yɛ, kä /cä jɛ go̱r ɛn ɣöö bä gɔ̱r kɛ galam kɛnɛ wäl gɔ̱rä.","14":"Ɣän göörä ni ɣöö bä yɛ nɛ kɛ kɔr ni̱ni ti tɔt, kä banɛ ruac a guɛcnɛ rɔ̱.","15":"A mal tekɛ ji̱. Jäk mäthniku ji̱ kä maalɛ. Kä lärni mäthnikɔn diaal maalɛ ramɔ kɛ ciötdɛ."},"headings":{"5":{"text":"Liak Gay-äth"},"9":{"text":"Day-ɔt-rɛ-pith kɛnɛ Di-mi-triäth"},"13":{"text":"Ner in jɔak"}}}},"Juud":{"1":{"verses":{"1":"Ɛ ɣän Juud in la läät Yecu Kritho, kä däman Je-mɛth. Gɔ̱a̱rä warɛgak ɛmɛ, yɛn nɛy tin ca mɛk kä ca nhɔk rɛy Kuɔth in la Gua̱a̱ra, kä ca gaŋ rɛy Yecu Kritho.","2":"A kɔ̱a̱c lɔaac, kɛnɛ mal kɛ nhök tekɛ yɛ ɛlɔ̱ŋ.","3":"Nhöökä, cä go̱r ɛlɔ̱ŋ ɛn ɣöö dëë yɛ gɔ̱rikä kɛ kui̱ känä min nyuaknɛ. Kä duundɛ ɣöö cä jek ɛn ɣöö bä yɛ gɔ̱r ruac mi dɔ̱ŋ, kä bä yɛ com ɛn ɣöö bia lät ɛlɔ̱ŋ kɛ kui̱ ŋäthä min ca ka̱m nɛy tin ci Kuoth kɛ lɛy ni kä kɛɛl.","4":"Cɛ tekɛ tha̱a̱ŋ nath ti ca rɔ̱ mat rɛydun kɛ tɛ̱̈ɛ̱̈. Ci bok ruac kɛ kui̱diɛn ni wal ɛn ɣöö bakɛ luk. Kɛ kɛn ji̱ nyuɔɔni tin rietkɛ puɔ̱th Kuɔthdan kɛ ɣöö bikɛ jiäkiɛn la̱t, kä jay kɛn Yecu Kritho min la Ŋi̱i̱cdan kä Kuääran in kɛl kärɔa.","5":"Täämɛ, ɣän göörä ɣöö bä yɛ ti̱em nɛmɛ, a cäŋ ni min ŋäc yɛnɛ ɛn ɣöö Kuäär, mëë ci naath kɔn kän muun I-jëp, cuɛ nɛy tëë thil luth kɛ jɛ näk kɛ jɔak.","6":"Kä cuɛ ja̱a̱k nhial, tin /ken gua̱thkiɛn tit, tëë ci gua̱a̱th cieŋädiɛn ba̱ny nhial, yiɛn kɛ kuatni ti thil pek, rɛy muɔ̱th mi col col kɛ kui̱ ca̱ŋ luɔ̱k in di̱i̱t.","7":"Kä timɛ bä ɛn ɣöö wec Thɔ-dɔm kɛnɛ Go-mo-ra kɛ rɛ̈k tëë thia̱k kɛ kɛ, tëë ci ji̱kiɛn lät ce̱tkɛ ja̱a̱k ti̱ti̱ tëë ci ciaaŋ tɔ̱ɔ̱cä kɛ leerä mi jiääk la̱t kä cukɛ kac raar. Kä cukɛ cuuc kɛ duäc maac mi do̱raar ala nyuuth kɛ kui̱ nɛɛni diaal.","8":"Kä kɛ ciaŋ min ce̱tkɛ nɔ cu nɛy ti ji̱ la̱a̱kni ti̱ti̱ pua̱nykiɛn ya̱r, cukɛ ruac kua̱ri lo̱k, kä cukɛ ja̱a̱k ti gɔw ti te nhial lat jɔ̱ɔ̱r.","9":"Kä duundɛ ɣöö mëë ci jääk nhial in di̱i̱t ni Mi-ka-el gaak kɛnɛ gua̱n jiäkni, kä cukɛ ŋaknɔm ŋak kɛ kui̱ pua̱a̱ny Muthɛ, /kenɛ jɛ go̱r ɛn ɣöö bɛ jɛ kuëth a bɛc, kä cuɛ wee i̱, “Bi Kuoth ji̱ luek!”","10":"Kä duundɛ ɣöö wutni ti̱ti̱ kɛn diaal latkɛ tin /ken cop lɔɔcdiɛn jɔ̱ɔ̱r. Kä ya̱rkɛ rɔ kɛ nyuɔɔn tin ca ŋäc, ce̱tkɛ lät tin lät leykɛ a thil ca̱r.","11":"Riɛk akɛ kɛ! Kɛ ɣöö guɔ̱ɔ̱rkɛ ni ciaŋ Këën, kä pa̱lkɛ rɔ̱ duer Bil-am kɛ ɣöö ba ŋɔak jek, kä cukɛ li̱w ce̱tkɛ mëë ci Kora li̱w mëë cɛ ruac Kuɔth lo̱k.","12":"Nɛy ti̱ti̱ kɛ gua̱r guäth mi̱eth ti̱mädun, mi̱thkɛ kɛɛl kɛ yɛ a thil dual, kä diɛɛr ni kɛn kɛ pua̱nykiɛn mi di̱i̱t kɛɛl, kɛ pua̱nykiɛn kärɔ̱. Ce̱tkɛ kɛ pua̱a̱r nhial ti /ci dɛ̈m, ti lɔk jiɔam kɛ. Ce̱tkɛ kɛ jiɛn ti thil dɛy, ti ci li̱w kä rɛɛw, kä cakɛ yut ni ciöknikiɛn.","13":"Kä ce̱tkɛ kɛ muaŋ baar mi di̱i̱t mi tekɛ tuɔ̱mbuɔ̱ɔ̱ri ti thil ŋu kɛ kui̱ po̱cädiɛn. Kä ce̱tkɛ kɛ kuɛl ti wi̱el rɛy puɔ̱ɔ̱rä kä ca muth mi col tɔ̱w kɛ kui̱diɛn a thil pek.","14":"Cu Ä-nɔk min guur A-dam kɛ ka̱a̱th bärɔw, ruac go̱o̱kä lat bä kɛ kui̱ nɛɛni ti̱ti̱, mi wëë i̱, “Nɛ̈nɛ jɛ, Kuäär ni Kuoth bëëkɛ kɛnɛ ja̱a̱kɛ ti kur bathdɔɔri ti rɛ̈lkɛ rɔ̱.","15":"Bëë kɛ ɣöö bɛ nɛy diaal ben luk, kä bɛ nɛy tin thil Kuoth kuɛth kɛ kui̱ nyuɔɔnikiɛn diaal tin ci kɛn kɛ la̱t kɛ dup ti jiäk, kɛnɛ rieet diaal ti jiäk tin ci ji̱ dueeri tin thil Kuoth kɛ lat kɛ kui̱dɛ.”","16":"Kɛ kɛn ji̱ kuɔɔkni, nɛy tin la bɛ̈lkɛ nɛy tin kɔ̱ŋ, la̱tkɛ ni tin jiäk tin di̱t lo̱ckiɛn kɛ kɛ. Kä liakɛ rɔ kɛ pua̱nykiɛn, pɛlkɛ naath kɛ ɣöö bikɛ ti gɔw jek kä kɛ.","17":"Kä yɛn, nhöökä, tiɛm ruaacni tëë ca lat ɛ jaak Kua̱ran ni Yecu Kritho dhil tit.","18":"Cikɛ yɛ jiök i̱, “Kɛ gua̱a̱th in jɔak bɛ tekɛ nɛy ti buɔ̱ykɛ naath ti guɔ̱ɔ̱rkɛ ni tin go̱o̱r kɛn kɛ tin thil Kuoth.”","19":"Kɛ kɛn nɛy tin nöŋkɛ dääk kam nath tin nhɔakɛ ni nyin muɔ̱ɔ̱n ɛ jiääk ɛmɛ, kä thilɛ Yiëë rɛy lo̱cnikiɛn.","20":"Kä yɛn nhöökä, bia ŋa̱thdun in gɔaa jakä di̱t rɛydun. Kä palɛ kɛ Yiëë in Gɔaa in Rɛl Rɔ.","21":"Yuɔpɛ rɔ rɛy nho̱kä Kuɔth. Liɛpɛ kɔ̱a̱c lɔaac Kua̱ran ni Yecu Kritho min no̱o̱ŋ tëk mi do̱raar.","22":"Kä nyuɔ̱th tha̱a̱ŋ nath tin tekɛ diw kɔ̱a̱c lɔaac.","23":"Ka̱nɛ tha̱a̱ŋ nath kɛ gɔpdiɛn raar rɛy maac. A lo̱ckun kɔ̱c kɛ tha̱a̱ŋ nath kɛ dual, kä lökɛ bi̱i̱, mi ca ya̱r kɛ pua̱nykiɛn.","24":"Täämɛ a Kuoth min tekɛ lua̱ŋ kɛ ɣöö bɛ yɛ gaŋ kä tëth, kä bɛ yɛ jakä cuŋ a thil bɛ̈l nhiam Kuɔth kɛ tɛ̈th lɔaac.","25":"A puɔny tekɛ Kuoth in kɛl kärɔa, min la Käändan rɛy Yecu Kritho in la Kuääran, min tekɛ buay, kɛ buɔ̱m, kɛnɛ lua̱ŋ kɛ kuäär te thi̱n gua̱thni diaal, ɛn täämɛ, amäni cäŋ kɛl. Inɔnɔ."},"headings":{"3":{"text":"Ŋi̱eec ka̱a̱cni"},"17":{"text":"Luek kɛnɛ comni"},"24":{"text":"Pal liakä Kuɔth"}}}}};

 <div class="wrap"><div class="votd"><div class="c"><small>Ka̱th ca̱ŋ ɛn walɛ · ${esc(refText(b,c,v))}</small><q>${esc(txt(b,c,v))}</q><button data-open="${esc(b)}|${c}|${v}">Kuɛnɛ rɛy buɔk</button></div></div>
 ${L?`<button class="resume" data-open="${esc(L.b)}|${L.c}|"><div><b>${esc(L.b)} ${L.c}</b><span>Wër kuɛnɛ</span></div><i>Tukdɛ</i></button>`:''}
 ${[['Ruac Kuɔth Ëë Wal',0,39],['Ruac Kuɔth In Thi̱a̱k',39,66]].map(([h,a,z])=>`<h2>${h}</h2><div class="books">${ORDER.slice(a,z).map(b=>{const n=META[b];return n?`<button class="book has" data-book="${esc(b)}"><div class="n">${n}</div><b>${esc(b)}</b><span>${n} ch.</span></button>`:`<button class="book off" disabled><b>${esc(b)}</b><span>Soon</span></button>`}).join('')}</div>`).join('')}</div></div>`}
function pickView(){return `<div class="top"><div class="in"><button class="ib" data-act="closepick" aria-label="Back">${I('back')}</button><div class="t">${esc(S.book)}</div><span class="ib"></span></div></div><div class="wrap"><div class="chgrid">${chs(S.book).map(c=>`<button class="${c===S.ch?'on':''}" data-open="${esc(S.book)}|${c}|">${c}</button>`).join('')}</div></div>`}
function reader(){
 const b=S.book,c=S.ch,H=BIBLE[b][c].headings||{},n=chs(b),i=n.indexOf(c);
 const body=vs(b,c).map(v=>{const key=k(b,c,v),h=P.hl[key];return (H[v]?`<h3>${esc(H[v].text)}</h3>`:'')+`<span class="v ${h?'h'+h:''} ${S.sel.has(v)?'sel':''}" id="v${v}" data-v="${v}"><sup>${v}</sup>${esc(txt(b,c,v))}${P.bm[key]?'<span class="bm">●</span>':''}</span> `}).join('');
 return `<div class="top"><div class="in"><button class="ib" data-act="home" aria-label="Books">${I('back')}</button><button class="t" data-act="pick">${esc(b)} ${c} ▾</button><button class="ib" data-act="settings" aria-label="Text settings"><b style="font-size:17px">Aa</b></button></div></div>
 <div class="wrap" id="swipe"><div class="chhead"><div class="big">${c}</div><div><b>${esc(b)}</b>${vs(b,c).length} käth</div></div><div class="text">${body}</div>
 <div class="pager"><button data-act="prev" ${i<1?'disabled':''}>Jɔk</button><button data-act="next" ${i>=n.length-1?'disabled':''}>Ci̱o̱o̱k in dɔ̱ŋ</button></div></div>`}
function selBar(){return `<div class="bar">${[1,2,3,4].map(n=>`<button class="sw" style="background:var(--h${n})" data-hl="${n}" aria-label="Highlight ${n}"></button>`).join('')}<button class="ib" data-hl="0" aria-label="Remove highlight">${I('x')}</button><hr><button class="ib" data-act="bm" aria-label="Bookmark">${I('saved')}</button><button class="ib" data-act="copy" aria-label="Copy">${I('copy')}</button><button class="ib" data-act="share" aria-label="Share">${I('share')}</button></div>`}
function nmap(s){let o='',m=[];for(let i=0;i<s.length;i++){const t=s[i].normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();for(const ch of t){o+=ch;m.push(i)}}return[o,m]}
const nrm=s=>nmap(s)[0];
function searchView(){
 const q=nrm(S.q.trim());let res='';
 if(q.length>=2){const out=[];for(const x of all){const [o,m]=nmap(txt(...x)),p=o.indexOf(q);if(p>-1){out.push([x,m[p],m[p+q.length-1]+1]);if(out.length>=60)break}}
  res=out.length?out.map(([x,a,z])=>{const t=txt(...x);return `<button class="hit" data-open="${esc(x[0])}|${x[1]}|${x[2]}"><b>${esc(refText(...x))}</b><p>${esc(t.slice(0,a))}<mark>${esc(t.slice(a,z))}</mark>${esc(t.slice(z))}</p></button>`}).join(''):'<div class="empty">No verses found.</div>'}
 else res='<div class="empty">Type at least two letters.<br>Accents are optional — “a” finds “a̱” too.</div>';
 return `<div class="wrap"><div class="search"><input id="q" type="search" placeholder="Search the text" value="${esc(S.q)}" autocomplete="off"></div><div id="res">${res}</div></div>`}
function savedView(){
 const bm=Object.keys(P.bm),hl=Object.keys(P.hl).filter(x=>!P.bm[x]),row=(key,mark)=>{const [b,c,v]=key.split('|');if(!BIBLE[b]||!BIBLE[b][c]||!txt(b,c,v))return'';return `<button class="hit" data-open="${esc(b)}|${c}|${v}"><b>${mark} ${esc(refText(b,c,v))}</b><p>${esc(txt(b,c,v))}</p></button>`};
 const html=bm.map(x=>row(x,'●')).join('')+hl.map(x=>row(x,'▮')).join('');
 return `<div class="wrap"><h2 style="font-size:30px;color:var(--ink);font-weight:800;letter-spacing:-.03em;margin-top:34px">Saved</h2>${html||'<div class="empty">Select verses while reading to highlight or bookmark them.</div>'}</div>`}
function settings(){return `<div class="sheet" data-act="closesheet"><div><div class="row"><b>Theme</b><div class="seg">${['auto','light','dark'].map(t=>`<button class="${P.theme===t?'on':''}" data-theme="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div><div class="row"><b>Text size</b><input type="range" id="fs" min="16" max="32" value="${P.fs}"></div><p class="text" style="font-size:${P.fs}px;margin:14px 0 0">Ɛ ɣän Pi-tɔr in la jak Yecu Kritho…</p></div></div>`}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-book],[data-open],[data-act],[data-hl],[data-v],[data-theme]');
 if(!t){return}
 const d=t.dataset;
 if(d.act==='closesheet'&&e.target!==t)return;
 if(d.theme){P.theme=d.theme;save();render();return}
 if(d.tab){if(d.tab==='set'){S.sheet=true}else{S.tab=d.tab}S.sel=new Set();render();if(d.tab==='search'||d.tab==='saved')loadAll().then(()=>{if(S.tab==='search'&&$('#res')){const x=document.createElement('div');x.innerHTML=searchView();$('#res').innerHTML=x.querySelector('#res').innerHTML}else if(S.tab==='saved')render()});return}
 if(d.book){const b=d.book;load(b).then(ok=>{if(!ok){toast('Book not available');return}S.book=b;S.pick=true;S.ch=P.last&&P.last.b===b?P.last.c:'1';render()});return}
 if(d.open){const [b,c,v]=d.open.split('|');open(b,c,v);return}
 if(d.v){const v=d.v;S.sel.has(v)?S.sel.delete(v):S.sel.add(v);buzz();const y=$('#main').scrollTop;render();$('#main').scrollTop=y;return}
 if(d.hl!==undefined){S.sel.forEach(v=>{const key=k(S.book,S.ch,v);d.hl==='0'?delete P.hl[key]:P.hl[key]=d.hl});save();S.sel=new Set();const y=$('#main').scrollTop;render();$('#main').scrollTop=y;return}
 switch(d.act){
  case'home':S.book=null;render();break;
  case'pick':S.pick=true;render();break;
  case'closepick':S.pick=false;if(!S.ch)S.book=null;render();break;
  case'closesheet':S.sheet=false;render();break;
  case'settings':S.sheet=true;render();break;
  case'prev':case'next':{const n=chs(S.book),i=n.indexOf(S.ch)+(d.act==='next'?1:-1);if(n[i]){open(S.book,n[i]);$('#main').scrollTop=0}break}
  case'bm':{const on=[...S.sel].every(v=>P.bm[k(S.book,S.ch,v)]);S.sel.forEach(v=>{const key=k(S.book,S.ch,v);on?delete P.bm[key]:P.bm[key]=1});save();toast(on?'Bookmark removed':'Bookmarked');S.sel=new Set();const y=$('#main').scrollTop;render();$('#main').scrollTop=y;break}
  case'copy':{const s=selText(),full=s.body+'\n— '+s.ref+' (Nuer Bible)';(navigator.clipboard?navigator.clipboard.writeText(full):Promise.reject()).then(()=>toast('Copied')).catch(()=>toast('Copy unavailable'));break}
  case'share':{const s=selText(),full='“'+s.body+'”\n— '+s.ref;try{if(tg){tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(location.href.split('#')[0])+'&text='+encodeURIComponent(full))}else if(navigator.share){navigator.share({text:full})}else{navigator.clipboard.writeText(full);toast('Copied to share')}}catch(er){toast('Sharing unavailable')}break}
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.q=e.target.value;const x=document.createElement('div');x.innerHTML=searchView();$('#res').innerHTML=x.querySelector('#res').innerHTML}
 if(e.target.id==='fs'){P.fs=+e.target.value;save();applyTheme();const p=document.querySelector('.sheet .text');if(p)p.style.fontSize=P.fs+'px'}
});
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(!e.target.closest('#swipe')||S.sheet)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>90&&Math.abs(dy)<50){const n=chs(S.book),i=n.indexOf(S.ch)+(dx<0?1:-1);if(n[i]){open(S.book,n[i]);$('#main').scrollTop=0}}});
if(tg){try{tg.ready();tg.expand();tg.BackButton.onClick(()=>{if(S.pick){S.pick=false}else{S.book=null}render()})}catch(e){}}
render();init();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
